<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Three.js core library (must load first) -->
    <script type="text/javascript" src="js/Three.iife.min.js"></script>
    <script>window.THREE = Three;</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    />

    <!-- Cyberpunk fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;600&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/cv.css" />
    <link rel="stylesheet" href="css/demo-nav.css" />
    <title>CV — Jensen Arcueid Peng</title>
  </head>
  <body>
    <!-- Cursor elements (demo1 style) -->
    <div id="cursor"></div>
    <div id="cursor-dot"></div>

    <!-- Logo-cube tunnel — scroll-driven figure-8 flight.
         Must precede #solar-background: both sit at z-index 0, so DOM order
         is what keeps the tunnel behind the solar system. -->
    <div id="cube-tunnel-bg"></div>

    <!-- Solar System Background — replaces ocean + cubes -->
    <div id="solar-background"></div>

    <!-- Serpent 3D canvas — sits above solar system, pointer-events: none -->
    <div id="canvas-container"></div>

    <!-- Scanline overlay for CRT/cyber effect -->
    <div id="scanlines"></div>

    <!-- Language selector button -->
    <div class="language-selector-container">
      <button id="languageBtn" class="language-btn hover-trigger">
        <span class="flag-icon">🌐</span>
        <span class="lang-text">EN</span>
        <span class="arrow">▼</span>
      </button>
      <div id="languageDropdown" class="language-dropdown">
        <div class="language-option" data-lang="en">
          <span class="flag">🇺🇸</span>
          <span>English</span>
        </div>
        <div class="language-option" data-lang="jp">
          <span class="flag">🇯🇵</span>
          <span>日本語</span>
        </div>
        <div class="language-option" data-lang="zh">
          <span class="flag">🇨🇳</span>
          <span>中文</span>
        </div>
      </div>
    </div>

    <!-- PDF button -->
    <button id="pdfBtn" class="pdf-btn hover-trigger">📄 PDF Resume</button>

    <!-- Market handbooks -->
    <a href="indicators.html" class="game-link-btn hover-trigger">📈 Indicators</a>
    <a href="options.html" class="game-link-btn hover-trigger" style="top:116px;">⚖️ Options</a>

    <!-- Game link button -->
    <a href="paints.html" class="game-link-btn hover-trigger" style="top:162px;">🎮 Wuwa Paint</a>
    <a href="text-effect.html" class="game-link-btn hover-trigger" style="top:208px;">✨ Text FX</a>
    <a href="cv2.html" class="game-link-btn hover-trigger" style="top:254px;">📄 Comics CV</a>


    <!-- Main CV content — section IDs used by solar system planet navigation -->
    <main>
      <!-- cv-modern.js dynamically loads all sections -->
      <!-- Section anchor IDs are injected by cv-modern.js via data attrs -->
    </main>

    <!-- Google Maps Section -->
    <div class="map-section" id="contact-section">
      <h2 class="section-title">📍 Current Location</h2>
      <div class="map-container">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d387190.27991515207!2d115.7459!3d-31.953512!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2a32966cdb47733d%3A0x304f0b535df55d0!2sPerth%20WA%2C%20Australia!5e0!3m2!1sen!2sau!4v1700000000000!5m2!1sen!2sau"
          width="100%"
          height="350"
          style="border: 0; border-radius: 12px"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        >
        </iframe>
        <div class="location-info">
          <h3>📍 Perth, Western Australia</h3>
        </div>
      </div>
    </div>

    <!-- AI Chatbot Section -->
    <div class="chatbot-section">
      <h2 class="section-title">💬 AI Assistant</h2>
      <div class="chatbot-container">
        <div class="chat-messages" id="chatMessages">
          <div class="bot-message">
            <div class="message-avatar">🤖</div>
            <div class="message-content">
              Hi! I'm Jensen's AI assistant powered by DeepSeek. Ask me anything
              about his experience, skills, or projects!
            </div>
          </div>
        </div>
        <div class="chat-input-container">
          <input
            type="text"
            id="chatInput"
            placeholder="Ask about Jensen's experience..."
            maxlength="500"
          />
          <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

    <!-- GSAP for smooth cursor animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Load order matters: Three.js first, then solar system, then CV data, then effects -->
    <script type="text/javascript" src="js/solar-system.js"></script>
    <script type="text/javascript" src="js/cv-modern.js"></script>
    <script type="text/javascript" src="js/chatbot.js"></script>
    <script type="text/javascript" src="js/cyber-effects.js"></script>
    <script type="text/javascript" src="js/serpent-mouse.js"></script>

    <!-- Logo-cube tunnel + demo launcher -->
    <script type="text/javascript" src="js/stock-logos.js"></script>
    <script type="text/javascript" src="js/logo-cube-tunnel.js"></script>
    <script type="text/javascript" src="js/demo-nav.js"></script>
    <script type="text/javascript">
      (function () {
        "use strict";

        // Transparent renderer so the page background and the solar system
        // still composite over it. Fewer cubes than the standalone demo — this
        // is a backdrop for the CV, not the subject.
        LogoCubeTunnel.create({
          container: document.getElementById("cube-tunnel-bg"),
          background: null,
          cubeCount: 48,
          // Wider corridor than the demo: keeps cubes off the reading area
          // instead of filling the frame as the camera passes them.
          corridorRadius: 7,
          opacity: 0.85
        });

        // Four peer buttons below the existing stack, which ends at top: 254px.
        DemoNav.mount({ theme: "cyber", top: 300, layout: "stack" });
      })();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flood Fill Game</title>
    <link rel="stylesheet" href="css/paints.css">
  </head>
  <body>
    <!-- Left: Color palette sidebar -->
    <div class="color-sidebar" id="colorSidebar">
      <div class="sidebar-label">COLOR</div>
      <div class="sidebar-palette">
        <div class="color-sample selected" data-color="0" style="background-color: #f1c40f" title="Yellow" onclick="selectColor(0)"></div>
        <div class="color-sample" data-color="1" style="background-color: #e74c3c" title="Red"    onclick="selectColor(1)"></div>
        <div class="color-sample" data-color="2" style="background-color: #3498db" title="Blue"   onclick="selectColor(2)"></div>
        <div class="color-sample" data-color="3" style="background-color: #27ae60" title="Green"  onclick="selectColor(3)"></div>
      </div>
    </div>

    <!-- Right: Game info sidebar -->
    <div class="info-sidebar" id="infoSidebar">
      <div class="info-block">
        <div class="info-label" id="movesLeftLabel">Moves Left</div>
        <div class="info-value" id="movesLeft">0</div>
      </div>
      <div class="info-divider"></div>
      <div class="info-block">
        <div class="info-label" id="targetColorLabel">Target</div>
        <div class="target-color-display" id="targetColorDisplay"></div>
      </div>
    </div>

    <div class="game-container">
      <!-- Language Selector -->
      <div class="language-selector">
        <button class="language-btn" id="languageBtn">
          <span class="flag-icon" id="langFlag">🇺🇸</span>
          <span class="lang-text" id="langText">EN</span>
          <span class="arrow">▼</span>
        </button>
        <div id="languageDropdown" class="language-dropdown">
          <div class="language-option" data-lang="en">
            <span class="flag">🇺🇸</span>
            <span>English</span>
          </div>
          <div class="language-option" data-lang="zh">
            <span class="flag">🇨🇳</span>
            <span>中文</span>
          </div>
        </div>
      </div>

      <h1 id="gameTitle">🎨 Flood Fill Game</h1>

      <div class="difficulty-info">
        <div><span id="gridSizeLabel">Grid Size</span>: <span id="gridSizeInfo">6x6</span></div>
        <div><span id="colorCountLabel">Colors</span>: <span id="colorCountInfo">3</span></div>
      </div>

      <div class="difficulty-info">
        <div id="instructionText">Select a color, then click a cell to flood fill</div>
      </div>

      <div class="grid-controls">
        <label for="grid-size-slider" id="gridSizeSliderLabel">Grid Size:</label>
        <input type="range" id="grid-size-slider" min="6" max="30" value="12"
               oninput="setGridSize(this.value)">
        <span id="grid-size-display">12</span>
      </div>

      <div class="grid-container">
        <div class="grid" id="gameGrid"></div>
      </div>

      <div class="game-status hidden" id="gameStatus"></div>

      <div class="controls">
        <button class="btn reduce-difficulty" onclick="reduceDifficulty()" id="reduceDifficultyBtn">Easier</button>
        <button class="btn retry"    onclick="retryGame()"      id="retryBtn">Retry</button>
        <button class="btn new-game" onclick="newGame()"        id="newGameBtn">New Game</button>
      </div>
    </div>

    <script src="js/paints.js"></script>
  </body>
</html>

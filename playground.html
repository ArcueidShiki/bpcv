100。它是一个阶梯，不是连续曲线。"},"en":{"insight":"A staircase with 13 possible values, not a continuous curve."}},"ind.VR":{"src":"ind","eid":"VR","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"Volume Ratio","nameZh":"成交量比率","zh":{"insight":"而把 TH、TL 各乘以 2 正是实现这个平分的技巧：分子分母同时放大两倍后，未加倍的 TQ 恰好相当于各占一半。这是一个纯代数技巧，理解它就不会对公式里那两个 2 感到困惑。"},"en":{"insight":"Doubling TH and TL is the algebraic trick that splits the unchanged-close volume evenly between both sides."}},"ind.CYC":{"src":"ind","eid":"CYC","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"Cost Average","nameZh":"成本均线","zh":{"insight":"流通股本 = 平均成交量 ÷ 换手率。这是合成值，形态可用于教学，数值不可用于实盘。"},"en":{"insight":"A synthetic float — shape is illustrative, the values are not tradable."}},"ind.CAPITALINFLOW":{"src":"ind","eid":"CAPITALINFLOW","cat":"money_flow","fam":"flow-signed","bucket":"trade","name":"Capital Inflow","nameZh":"资金净流入","zh":{"insight":"主动买入记 +1，主动卖出记 −1。关键在于：这个方向是推断出来的，不是交易所给的。常用 tick 规则（比上一笔价高算主动买）或报价规则（成交在卖一价算主动买）。"},"en":{"insight":"The aggressor side is INFERRED, not reported — via the tick rule or the quote rule. That inference is the weakest link in the whole metric."}},"ind.ORDERINFLOW_XL":{"src":"ind","eid":"ORDERINFLOW_XL","cat":"money_flow","fam":"flow-signed","bucket":"trade","name":"Extra Large Order Inflow","nameZh":"特大单净流入","zh":{"insight":"判断主动买（+1）或主动卖（−1）。再次强调：这个方向是推断的，不是观测到的。"},"en":{"insight":"Inferred, not observed — this is the assumption everything downstream rests on."}},"ind.ORDERINFLOW_L":{"src":"ind","eid":"ORDERINFLOW_L","cat":"money_flow","fam":"flow-signed","bucket":"trade","name":"Large Order Inflow","nameZh":"大单净流入","zh":{"insight":"而大单这一档恰恰是各家数据商分界差异最大的一档。因此不同软件上的\"大单净流入\"数值可能完全对不上，跨平台比较这个指标是没有意义的。"},"en":{"insight":"This is the bucket whose boundaries differ most between vendors, so the same stock can show contradictory large-order flow on two platforms."}},"ind.ORDERINFLOW_M":{"src":"ind","eid":"ORDERINFLOW_M","cat":"money_flow","fam":"flow-signed","bucket":"trade","name":"Medium Order Inflow","nameZh":"中单净流入","zh":{"insight":"既不够大到被认定为机构，也不够小到被认定为散户。正因为是残差，它的解释力最弱，通常不单独作为决策依据。"},"en":{"insight":"Definitionally a residual — neither big enough to read as institutional nor small enough to read as retail, which is why it carries the least interpretive weight."}},"ind.ORDERINFLOW_S":{"src":"ind","eid":"ORDERINFLOW_S","cat":"money_flow","fam":"flow-signed","bucket":"trade","name":"Small Order Inflow","nameZh":"小单净流入","zh":{"insight":"这就是\"小单 = 散户\"这一解读的根本问题：你看到的小单里，很可能相当一部分正是机构在悄悄建仓。整套大单/小单分类的前提在算法交易普及后已经严重削弱。"},"en":{"insight":"So \"small = retail\" can be precisely backwards. The whole size-bucket taxonomy weakened badly once algo execution became standard."}},"ind.OPENINTEREST":{"src":"ind","eid":"OPENINTEREST","cat":"money_flow","fam":"chain-read","bucket":"read","name":"Futures Open Interest","nameZh":"期货持仓量","zh":{"insight":"由交易所公布，通常 T+1。它是存量（时点数），不是流量，这一点与成交量截然不同：同一手合约反复买卖会推高成交量，但不改变持仓量。"},"en":{"insight":"A level, not a flow. Trading the same contract back and forth inflates volume but leaves open interest unchanged."}},"ind.POSITIONCHANGE":{"src":"ind","eid":"POSITIONCHANGE","cat":"money_flow","fam":"chain-read","bucket":"read","name":"Futures Daily OI Increase","nameZh":"期货日增仓","zh":{"insight":"减仓 + 下跌 = 多头减仓（多头止损离场）。注意后两种都是\"平仓行为\"驱动的价格变化，与前两种\"新资金入场\"在持续性上有本质区别。"},"en":{"insight":"The last two are driven by position closing rather than new conviction, which is why they tend to be less durable than the first two."}},"ind.OPT_OI":{"src":"ind","eid":"OPT_OI","cat":"price_volume","fam":"chain-read","bucket":"read","name":"Options Open Interest","nameZh":"期权未平仓合约数","zh":{"insight":"按到期日拆分才能看到仓位在时间上集中在哪里。总持仓只能告诉你\"整体参与度\"，任何具体的价位判断都必须回到分行权价的明细。"},"en":{"insight":"The aggregate tells you participation and nothing about levels. Any strike-specific conclusion requires the per-strike breakdown."}},"ind.OPT_VOL":{"src":"ind","eid":"OPT_VOL","cat":"price_volume","fam":"chain-read","bucket":"read","name":"Options Volume","nameZh":"期权成交量","zh":{"insight":"除以总持仓，得到\"存量仓位的换手率\"——这个比值突然升高，说明现有仓位在被大规模调整，往往比单纯的放量更有信息量。"},"en":{"insight":"Volume over open interest is the turnover of the standing book. A jump there means existing positions are being restructured, which is more informative than raw volume."}},"ind.OPT_OIPCR":{"src":"ind","eid":"OPT_OIPCR","cat":"price_volume","fam":"chain-read","bucket":"read","name":"Open Interest Put/Call Ratio","nameZh":"未平仓量认沽认购比","zh":{"insight":"因此必须把它当作相对自身 1–2 年历史的百分位来读，绝不能与某个绝对数字比较。这是这个指标最常见的误用。"},"en":{"insight":"The neutral level is NOT 1.0 — each underlying has a structural baseline set by how much systematic hedging it attracts."}},"ind.OPT_VOLPCR":{"src":"ind","eid":"OPT_VOLPCR","cat":"price_volume","fam":"chain-read","bucket":"read","name":"Volume Put/Call Ratio","nameZh":"成交量认沽认购比","zh":{"insight":"极低表示市场过度自满，反向看偏空。注意\"反向指标\"只在极端处成立，中间区域的读数没有预测价值——把它当作日常方向指标使用是错误的。"},"en":{"insight":"The contrarian reading only holds at extremes. Mid-range values carry no predictive content, so it is not a day-to-day direction tool."}},"ind.ADD_SPX":{"src":"ind","eid":"ADD_SPX","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Advance/Decline Spread (S&P 500)","nameZh":"涨跌家数差（标普 500）","zh":{"insight":"广度推力筛选：连续 k 日 ADD/(A+B) 大于 0.80，被视为强势启动信号（Zweig 推力的变体）。"},"en":{"insight":"The cumulative A/D line diverging from the index — index at new highs while the line is not — is the classic warning that the advance has narrowed to a few heavyweights."}},"ind.ADD_IXIC":{"src":"ind","eid":"ADD_IXIC","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Advance/Decline Spread (NASDAQ Composite)","nameZh":"涨跌家数差（纳斯达克综合指数）","zh":{"insight":"关键警告：纳指的成分股数量不固定，历史上在约 2,000 到 5,000 之间大幅变动，"},"en":{"insight":"Any multi-year study must use the normalised form."}},"ind.ADD_DJI":{"src":"ind","eid":"ADD_DJI","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Advance/Decline Spread (Dow Jones Industrial Average)","nameZh":"涨跌家数差（道琼斯工业平均指数）","zh":{"insight":"相当于满量程的 18%。也就是说，道指 ADD 读数在 ±5 以内基本无法与随机噪音区分。用 30 只股票衡量\"市场广度\"在统计上是很脆弱的。"},"en":{"insight":"A fair coin at n = 30 produces about ±5.5 of noise, 18% of full scale — readings inside ±5 are statistically indistinguishable from chance."}},"ind.ADD_HSI":{"src":"ind","eid":"ADD_HSI","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Advance/Decline Spread (Hang Seng Index)","nameZh":"涨跌家数差（恒生指数）","zh":{"insight":"注意成分股数量在 2020 至 2023 年间从 50 只扩容到 82 只，"},"en":{"insight":"The 2020–2023 expansion from 50 to 82 members breaks any cumulative series across that window; the shift is mechanical, not a market signal."}},"ind.ADD_HSTECH":{"src":"ind","eid":"ADD_HSTECH","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Advance/Decline Spread (Hang Seng TECH Index)","nameZh":"涨跌家数差（恒生科技指数）","zh":{"insight":"权重虽然设了 8% 上限，前五大仍占约 35%。这意味着\"广度指标\"在这里几乎不提供独立于指数本身的信息，有效样本量远小于 30。"},"en":{"insight":"The effective sample size is far below 30, so this breadth series adds little information beyond the index itself."}},"ind.ADR_IXIC":{"src":"ind","eid":"ADR_IXIC","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Advance/Decline Ratio (NASDAQ Composite)","nameZh":"涨跌比率（纳斯达克综合指数）","zh":{"insight":"结构性提醒：纳指涨跌比的长期均值低于 1.0，因为微型股尾部长期跑输。把 1.0 当作中性线会长期误判为\"偏空\"。"},"en":{"insight":"Asymmetric: unbounded above, floored at zero. Average ln(ADR), not ADR."}},"ind.ADR_DJI":{"src":"ind","eid":"ADR_DJI","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Advance/Decline Ratio (Dow Jones Industrial Average)","nameZh":"涨跌比率（道琼斯工业平均指数）","zh":{"insight":"27/3 = 9.0，28/2 = 14.0，29/1 = 29.0，30/0 则直接无定义。这种爆炸性使道指 ADR 在极端行情下的数值几乎无法解读，必须改看差值或百分比形式。"},"en":{"insight":"One stock changes the ratio enormously at the extremes, and 30/0 is undefined — the ratio becomes unreadable exactly when the market is most interesting."}},"ind.ADR_HSI":{"src":"ind","eid":"ADR_HSI","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Advance/Decline Ratio (Hang Seng Index)","nameZh":"涨跌比率（恒生指数）","zh":{"insight":"而差值版本在那段时间是断裂的。这是选择比值而非差值的实际理由。"},"en":{"insight":"Being scale-free lets the ratio survive the constituent expansion that breaks the spread version."}},"ind.ADR_HSTECH":{"src":"ind","eid":"ADR_HSTECH","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Advance/Decline Ratio (Hang Seng TECH Index)","nameZh":"涨跌比率（恒生科技指数）","zh":{"insight":"并不以 1 为中心。因此常规的\"大于 1 看多\"解读在这里几乎没有信息量——它只是重复了指数本身的涨跌。"},"en":{"insight":"The distribution is bimodal rather than centred on 1, so the usual \"above 1 is bullish\" reading merely restates the index move."}},"ind.MCL":{"src":"ind","eid":"MCL","cat":"breadth","fam":"breadth-part","bucket":"read","name":"McClellan Oscillator","nameZh":"麦克莱伦振荡器","zh":{"insight":"因此教科书里的 ±100 阈值不适用于本页数值。要用阈值，必须先在本页的历史分布上重新校准。"},"en":{"insight":"The textbook ±100 thresholds do not transfer to raw counts; recalibrate against this page's own distribution."}},"ind.SPX_MA200":{"src":"ind","eid":"SPX>MA200","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Stocks Above 200-Day MA (S&P 500)","nameZh":"标普 500 成分股站上 200 日均线占比","zh":{"insight":"注意底层实现返回的是 0–1 的比率，图表上乘以 100 显示。"},"en":{"insight":"Below 20 usually marks a washout and has historically coincided with intermediate lows."}},"ind.NDX_MA200":{"src":"ind","eid":"NDX>MA200","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Stocks Above 200-Day MA (Nasdaq 100)","nameZh":"纳斯达克 100 成分股站上 200 日均线占比","zh":{"insight":"所以这个序列只能取整数值。这是一个巧合带来的便利：读数 63 就是字面意义上的 63 只股票。"},"en":{"insight":"A convenient coincidence: a reading of 63 literally means 63 stocks."}},"ind.IXIC_MA200":{"src":"ind","eid":"IXIC>MA200","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Stocks Above 200-Day MA (NASDAQ Composite)","nameZh":"纳斯达克综合指数成分股站上 200 日均线占比","zh":{"insight":"因此看到 45 不能直接判断为\"偏弱\"——必须先知道它自身的历史基准率。这是所有宽基广度指标共同的陷阱：中性线不在 50。"},"en":{"insight":"A reading of 45 is not \"weak\" until you know the base rate. Broad-universe breadth series do not have their neutral line at 50."}},"ind.DJI_MA200":{"src":"ind","eid":"DJI>MA200","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Stocks Above 200-Day MA (Dow Jones Industrial Average)","nameZh":"道琼斯工业指数成分股站上 200 日均线占比","zh":{"insight":"也就是一只股票 = 3.33 个百分点。这么粗的粒度意味着它无法反映细微的广度变化，只适合看极端状态。"},"en":{"insight":"One stock equals 3.33 percentage points — too coarse for subtle shifts, useful only at extremes."}},"ind.SOX_MA200":{"src":"ind","eid":"SOX>MA200","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Stocks Above 200-Day MA (Philadelphia Semiconductor Index)","nameZh":"费城半导体指数成分股站上 200 日均线占比","zh":{"insight":"因此该序列的行为接近方波：要么绝大多数在均线上，要么绝大多数在下，中间过渡很快。半导体是强周期行业，这个形态本身就是行业属性的体现。"},"en":{"insight":"Sharing one industrial cycle makes the series behave like a square wave — mostly all above or all below, with fast transitions."}},"ind.N225_MA200":{"src":"ind","eid":"N225>MA200","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Stocks Above 200-Day MA (Nikkei 225)","nameZh":"日经 225 成分股站上 200 日均线占比","zh":{"insight":"所以它可以长期与指数背离，这是构造上的必然而非异常。日经涨而广度不涨，往往只是几只高价股在动。"},"en":{"insight":"Long divergences from the index are structural, not anomalies: the Nikkei is price-weighted while this series is equal-weighted."}},"ind.HSI_MA200":{"src":"ind","eid":"HSI>MA200","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Stocks Above 200-Day MA (Hang Seng Index)","nameZh":"恒生指数成分股站上 200 日均线占比","zh":{"insight":"不像美股那样均值回归。因此用美股经验中的\"低于 20 即将反弹\"来交易港股广度，会在长熊市中反复抄底失败。"},"en":{"insight":"Importing the US intuition that \"below 20 means a bounce is near\" fails here, because policy regimes in this market persist far longer."}},"ind.HSTECH_MA200":{"src":"ind","eid":"HSTECH>MA200","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Stocks Above 200-Day MA (Hang Seng TECH Index)","nameZh":"恒生科技指数成分股站上 200 日均线占比","zh":{"insight":"这意味着有效样本量远小于 30。统计上它更接近\"一只股票\"而非\"三十只股票\"，"},"en":{"insight":"Treating it as independent breadth confirmation is misleading — statistically it behaves closer to one name than thirty."}},"ind.HXC_MA200":{"src":"ind","eid":"HXC>MA200","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Stocks Above 200-Day MA (Nasdaq China Golden Dragon Index)","nameZh":"纳斯达克中国金龙指数成分股站上 200 日均线占比","zh":{"insight":"因此该序列基本上是指数本身的平滑滞后副本——它几乎不提供指数之外的独立信息。想用广度来确认中概股行情时，这一点必须先想清楚。"},"en":{"insight":"One regulatory regime, one headline stream, one investor base — the series is close to a smoothed, delayed copy of the index and adds little independent information."}},"ind.CVLT":{"src":"ind","eid":"CVLT","cat":"other","fam":"vol-size","bucket":"trade","name":"Chaikin Volatility","nameZh":"蔡金波动率","zh":{"insight":"请注意它的基础量是日内振幅，不是收盘到收盘的收益率。这是它与标准历史波动率的根本区别：CVLT 衡量的是\"盘中波动在扩张还是收缩\"，完全不涉及方向，也不受跳空影响（跳空发生在两根之间，不在振幅内）。"},"en":{"insight":"The base quantity is the intraday spread, not close-to-close return. It measures range expansion and is blind to both direction and gaps."}},"ind.HSLC":{"src":"ind","eid":"HSLC","cat":"other","fam":"osc-threshold","bucket":"trade","name":"Hard And Soft Limiter Comparison","nameZh":"软硬限幅器对比","zh":{"insight":"注意此处的 \"limiter\" 指信号限幅（电子工程术语），与股票的涨跌停限制毫无关系。"},"en":{"insight":"\"Limiter\" here is signal clipping in the electronics sense, not a price limit."}},"ind.IC":{"src":"ind","eid":"IC","cat":"other","fam":"osc-threshold","bucket":"trade","name":"Ichimoku Kinko Hyo","nameZh":"一目均衡表","zh":{"insight":"关键提醒：一目均衡表的所有\"平均\"都是区间中点（最高加最低除以二）， 而不是收盘价的平均。这是它与所有均线系统的根本差异——中点对极值敏感、对收盘价不敏感，因此它描述的是\"波动区间的中枢\"而非\"平均成本\"。另外要注意：云被前移了 26 根，因此图表右侧的云是已知的，这是一目均衡表少数具有前瞻性的部分。"},"en":{"insight":"Every average is a MIDPOINT of the high-low range, not a mean of closes — the fundamental difference from every moving-average system. The cloud is displaced 26 bars forward, so the cloud to the right of price is already known — the one genuinely forward-looking element."}},"ind.MICD":{"src":"ind","eid":"MICD","cat":"other","fam":"osc-threshold","bucket":"trade","name":"Momentum Indicator Convergence Divergence","nameZh":"异同离差动力指数","zh":{"insight":"DIF 取两条不同周期均线之差，注意都作用在昨天的 AMI 上。"},"en":{"insight":"So this apparently elaborate indicator is arithmetically close to a scaled difference of two ROC readings, wrapped in several smoothing layers."}},"ind.NINE":{"src":"ind","eid":"NINE","cat":"other","fam":"osc-threshold","bucket":"trade","name":"Tom Demark Sequential 9","nameZh":"神奇九转（TD 序列 9）","zh":{"insight":"任何一根打破条件，计数立即归零。这个\"必须连续\"的要求是 TD 序列的核心，也意味着它天然带有回填特性——你在历史图上看到的完美九转，在当时的第 6 根上是无法确认的。"},"en":{"insight":"Which means a perfect setup visible in hindsight was not confirmable at bar six in real time."}},"ind.RC":{"src":"ind","eid":"RC","cat":"other","fam":"osc-threshold","bucket":"trade","name":"Change Rate","nameZh":"变化率指数","zh":{"insight":"注意有效记忆约为 M（回看）+ M（平滑）≈ 100 根。这意味着它对近期变化极不敏感，是一个长周期的趋势状态判断工具，用它做择时会严重滞后。"},"en":{"insight":"Effective memory is the lookback plus the smoothing, about 100 bars — a long-horizon regime read, badly lagged for timing."}},"ind.RCCD":{"src":"ind","eid":"RCCD","cat":"other","fam":"osc-threshold","bucket":"trade","name":"Rate of Change Convergence Divergence","nameZh":"异同离差变化率指数","zh":{"insight":"输出量级通常在千分之几。三点合起来的含义是：这个指标极度平滑、极度滞后、数值极小，它只适合观察超长周期的动能背离，任何短中期用途都不合适。"},"en":{"insight":"Extremely smoothed, heavily lagged and tiny in magnitude — suitable only for very long-horizon divergence, nothing shorter."}},"ind.SRMI":{"src":"ind","eid":"SRMI","cat":"other","fam":"osc-threshold","bucket":"trade","name":"SRMI Indicator","nameZh":"SRMI 修正动量指标","zh":{"insight":"一个具体例子说明它的性质：上涨 100% 读数为 +0.50，而随后回撤 50%（正好抵消）读数为 −0.50。两者绝对值相同——这正是设计意图：让\"涨一倍\"和\"跌一半\"这对互逆操作在指标上对称，而普通百分比做不到（+100% 与 −50%）。"},"en":{"insight":"A +100% move reads +0.50 and the offsetting −50% move reads −0.50 — the two inverse operations become symmetric, which plain percentages never are."}},"ind.SVSI":{"src":"ind","eid":"SVSI","cat":"other","fam":"osc-threshold","bucket":"trade","name":"Slow Volume Strength Index","nameZh":"慢速成交量强弱指数","zh":{"insight":"注意用的是线性加权平均（WMA），因此最近几根的权重明显更高，反应比等权平均快。"},"en":{"insight":"It measures whether volume is occurring above or below the average, not price strength. Heavy selling drives it down even when the price decline is modest."}},"ind.UTBOT":{"src":"ind","eid":"UTBOT","cat":"other","fam":"stop-trail","bucket":"trade","name":"UT Bot Alerts","nameZh":"UT Bot 跟踪止损警报","zh":{"insight":"关键特征：止损是从收盘价起算的，而不是从波段极值起算。这与 Chandelier、SAR 等以极值为锚的追踪止损有本质区别——以收盘为锚意味着它对影线不敏感，不容易被长上影洗出去，但相应地在急速反转时会退让更多。"},"en":{"insight":"The stop trails from the CLOSE, never from the swing extreme. That makes it insensitive to wicks — harder to shake out, but it concedes more on a sharp reversal."}},"ind.WF":{"src":"ind","eid":"WF","cat":"other","fam":"osc-threshold","bucket":"trade","name":"Williams Fractal","nameZh":"威廉分形","zh":{"insight":"注意一侧用\"不低于\"、另一侧用\"严格大于\"——这个不对称是刻意的："},"en":{"insight":"The lag is definitional, not an implementation choice — the right-hand bars are required to make the judgement. Any \"real-time fractal\" is looking ahead."}},"ind.TOTALREVENUE_FQ":{"src":"ind","eid":"TOTALREVENUE_FQ","cat":"income_statement","fam":"ratio-quality","bucket":"define","name":"Total Revenue · FQ","nameZh":"总营收 · 单季","zh":{"insight":"同比增速对比去年同一季度，正好抵消季节性（零售的 Q4、教育的暑期都会自动对齐），因此同比通常比环比更可信。"},"en":{"insight":"Read growth, not level; the level only tells you company size."}},"ind.NETPROFIT_FQ":{"src":"ind","eid":"NETPROFIT_FQ","cat":"income_statement","fam":"ratio-quality","bucket":"define","name":"Net Profit · FQ","nameZh":"净利润 · 单季","zh":{"insight":"净利率 = 净利润 ÷ 收入，衡量每一块钱收入最终能留下多少。"},"en":{"insight":"Net margin: how much of each sales dollar survives to the bottom."}},"ind.FCF_FY":{"src":"ind","eid":"FCF_FY","cat":"cash_flow","fam":"ratio-quality","bucket":"define","name":"Free Cash Flow · FY","nameZh":"自由现金流 · 年度","zh":{"insight":"自由现金流收益率 = FCF ÷ 市值，可以直接与债券收益率对比，是估值的现金锚。它比市盈率更难被会计处理粉饰，因为现金流很难造假。"},"en":{"insight":"FCF yield is directly comparable to a bond yield, and is harder to dress up with accounting choices than earnings."}},"ind.ROE_FY":{"src":"ind","eid":"ROE_FY","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Return on Equity · FY","nameZh":"净资产收益率 · 年度","zh":{"insight":"靠权益乘数（杠杆）撑起来的高 ROE 是伪装成质量的风险：借得越多，权益越薄，ROE 越好看，但下行时亏损同样被放大。看到高 ROE 必须先做这一步拆分。"},"en":{"insight":"A high ROE built on leverage is risk wearing the costume of quality — thin equity flatters the ratio and magnifies losses on the way down."}},"ind.GROSSMARGIN_FY":{"src":"ind","eid":"GROSSMARGIN_FY","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Gross Margin · FY","nameZh":"毛利率 · 年度","zh":{"insight":"持续下行则往往是竞争加剧或原材料涨价的第一个信号。它是所有利润率里对经营环境变化最敏感的一个。"},"en":{"insight":"Only direct product cost is removed — a high gross margin does not mean the business makes money."}},"ind.CURRENTRATIO_FY":{"src":"ind","eid":"CURRENTRATIO_FY","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Current Ratio · FY","nameZh":"流动比率 · 年度","zh":{"insight":"过高也不是好事：可能意味着大量资金闲置在低效资产上没有投入经营，是一种隐性的资本浪费。"},"en":{"insight":"Very high is not automatically good: it can mean capital sitting idle in unproductive assets."}},"ind.TOTALASSETS_FQ":{"src":"ind","eid":"TOTALASSETS_FQ","cat":"balance_sheet","fam":"ratio-quality","bucket":"define","name":"Total Assets · FQ","nameZh":"总资产 · 单季","zh":{"insight":"总资产是季末公司拥有的全部资源，属于时点数（存量），不是一段时间的流量。"},"en":{"insight":"A point-in-time level (a stock), not a flow across a period."}},"ind.TOTALASSETS_FY":{"src":"ind","eid":"TOTALASSETS_FY","cat":"balance_sheet","fam":"ratio-quality","bucket":"define","name":"Total Assets · FY","nameZh":"总资产 · 年度","zh":{"insight":"权益/资产 = 1 −（负债/资产），即\"自有资金占比\"。这个比例越低，杠杆越高，顺风时放大收益，逆风时同样放大亏损。"},"en":{"insight":"Equity over assets is the un-leveraged share. The lower it is, the more leverage — which amplifies both directions, not just the good one."}},"ind.SH_EQUITY_FQ":{"src":"ind","eid":"SH_EQUITY_FQ","cat":"balance_sheet","fam":"ratio-quality","bucket":"define","name":"Stockholders' Equity·FQ","nameZh":"股东权益 · 单季","zh":{"insight":"权益的逐期演进：上期权益 + 净利润 − 分红 − 回购 ± 其他综合收益 ± 增发。注意分红和回购会让权益减少——这不是变坏，是把钱还给股东。"},"en":{"insight":"How equity walks forward. Dividends and buybacks reduce it — that is capital being returned, not deterioration."}},"ind.SH_EQUITY_FY":{"src":"ind","eid":"SH_EQUITY_FY","cat":"balance_sheet","fam":"ratio-quality","bucket":"define","name":"Stockholders' Equity·FY","nameZh":"股东权益 · 年度","zh":{"insight":"剔除增发因素后，权益的增长率约等于留存利润的复利速度——这是\"账面价值复利机器\"的数学形式。"},"en":{"insight":"Ex-issuance, equity growth is retained earnings compounding."}},"ind.NCA_FQ":{"src":"ind","eid":"NCA_FQ","cat":"balance_sheet","fam":"ratio-quality","bucket":"define","name":"Total Liabilities · FQ","nameZh":"总负债 · 单季","zh":{"insight":"注意本条目 id 为 NCA，但它声明的是总负债。图上按季度阶梯绘制。"},"en":{"insight":"The id says NCA but the series is total liabilities."}},"ind.NCA_FY":{"src":"ind","eid":"NCA_FY","cat":"balance_sheet","fam":"ratio-quality","bucket":"define","name":"Total Liabilities · FY","nameZh":"总负债 · 年度","zh":{"insight":"年末总负债。看多年趋势时，重点不是绝对额而是杠杆结构是否在恶化。"},"en":{"insight":"High, stable leverage means fixed obligations, and a downturn does not forgive them. Leverage amplifies variance, not expected return."}},"ind.OCF_FQ":{"src":"ind","eid":"OCF_FQ","cat":"cash_flow","fam":"ratio-quality","bucket":"define","name":"Operating Cash Flow · FQ","nameZh":"经营性现金流 · 单季","zh":{"insight":"经营现金流长期小于净利润，要警惕：可能是应收账款收不回来，或者存货在积压——利润记在账上，钱没进门。这是财务暴雷最常见的前兆之一。"},"en":{"insight":"Cash persistently below profit is a warning: receivables not collected or inventory piling up. Profit on the page, no money through the door."}},"ind.OCF_FY":{"src":"ind","eid":"OCF_FY","cat":"cash_flow","fam":"ratio-quality","bucket":"define","name":"Operating Cash Flow · FY","nameZh":"经营性现金流 · 年度","zh":{"insight":"经营现金流是整个现金瀑布的顶端：经营现金流 − 资本开支 = 自由现金流。"},"en":{"insight":"Cash conversion should sit near or above 1 for a quality business. Persistently below 1 means reported profit is not turning into money."}},"ind.FCF_FQ":{"src":"ind","eid":"FCF_FQ","cat":"cash_flow","fam":"ratio-quality","bucket":"define","name":"Free Cash Flow · FQ","nameZh":"自由现金流 · 单季","zh":{"insight":"处于重资本投入期的公司出现单季负自由现金流是正常的，不必然是风险信号——要看这笔投入未来是否形成产能。"},"en":{"insight":"One negative quarter during a heavy build is normal, not a warning."}},"ind.DILUTEDEPS_FQ":{"src":"ind","eid":"DILUTEDEPS_FQ","cat":"income_statement","fam":"ratio-quality","bucket":"define","name":"Diluted EPS·FQ","nameZh":"稀释每股收益 · 单季","zh":{"insight":"超预期幅度 =（实际 − 一致预期）÷ |一致预期|。注意股价反应的是与预期的差，而不是利润本身的好坏——利润增长 30% 但预期是 40%，股价照样跌。"},"en":{"insight":"The market reacts to the gap against consensus, not to the level: +30% growth against a +40% expectation still sells off."}},"ind.DILUTEDEPS_FY":{"src":"ind","eid":"DILUTEDEPS_FY","cat":"income_statement","fam":"ratio-quality","bucket":"define","name":"Diluted EPS·FY","nameZh":"稀释每股收益 · 年度","zh":{"insight":"强调\"每股\"：对股东而言重要的不是公司总利润增长多少，而是分摊到你手上的那一份增长多少。持续增发扩张的公司，总利润涨了但每股收益可能原地踏步。"},"en":{"insight":"Per-share is what matters to an owner. A company that grows total profit by issuing shares can leave EPS flat."}},"ind.GROSSPROFIT_FQ":{"src":"ind","eid":"GROSSPROFIT_FQ","cat":"income_statement","fam":"ratio-quality","bucket":"define","name":"Gross Profit · FQ","nameZh":"毛利润 · 单季","zh":{"insight":"真正有信息量的是毛利率——它反映定价权和成本控制，而毛利金额还混着规模因素。"},"en":{"insight":"The margin carries the signal — pricing power and cost control — while the dollar amount is confounded with size."}},"ind.GROSSPROFIT_FY":{"src":"ind","eid":"GROSSPROFIT_FY","cat":"income_statement","fam":"ratio-quality","bucket":"define","name":"Gross Profit · FY","nameZh":"毛利润 · 年度","zh":{"insight":"而对股东最终能拿到什么而言，净利润和自由现金流比毛利重要得多——毛利之上还有销售、管理、研发、利息和税要扣。"},"en":{"insight":""}},"ind.NETPROFIT_FY":{"src":"ind","eid":"NETPROFIT_FY","cat":"income_statement","fam":"ratio-quality","bucket":"define","name":"Net Profit · FY","nameZh":"净利润 · 年度","zh":{"insight":"一整年同样可能包含大额减值、重组费用或终止经营损益。看到净利润突然大幅波动时，先去翻附注确认是不是一次性项目，而不是直接当成经营恶化。"},"en":{"insight":""}},"ind.TOTALREVENUE_FY":{"src":"ind","eid":"TOTALREVENUE_FY","cat":"income_statement","fam":"ratio-quality","bucket":"define","name":"Total Revenue · FY","nameZh":"总营收 · 年度","zh":{"insight":"三年复合增长率：把三年的总增长开三次方还原成年化速度。用 CAGR 而不是简单平均，是因为增长是乘性复利的——先涨 100% 再跌 50% 的复合增长是 0，不是 25%。"},"en":{"insight":"Compound annual growth, not an arithmetic average — growth compounds multiplicatively, so +100% then −50% is 0% CAGR, not +25%."}},"ind.NIPC_FQ":{"src":"ind","eid":"NIPC_FQ","cat":"income_statement","fam":"ratio-quality","bucket":"define","name":"Net Profit to Shareholders · FQ","nameZh":"归母净利润 · 单季","zh":{"insight":"当一家子公司被合并报表但母公司并非 100% 持股时，子公司 100% 的利润都会进入\"净利润\"，但只有母公司持股比例对应的部分能进入\"归母净利润\"。"},"en":{"insight":"EPS must be computed from this line, not total net profit. In group structures the two can differ materially."}},"ind.NIPC_FY":{"src":"ind","eid":"NIPC_FY","cat":"income_statement","fam":"ratio-quality","bucket":"define","name":"Net Profit to Shareholders · FY","nameZh":"归母净利润 · 年度","zh":{"insight":"你实际支付的市盈率倍数建立在这一行上，而不是总净利润。合并报表里少数股东权益占比高的公司，用总净利润算 P/E 会系统性低估估值。"},"en":{"insight":"The multiple you actually pay rests on this line. Using total net profit for a group with large minority interests systematically understates the P/E."}},"ind.OPERATINGPROFIT_FQ":{"src":"ind","eid":"OPERATINGPROFIT_FQ","cat":"income_statement","fam":"ratio-quality","bucket":"define","name":"Operating Profit · FQ","nameZh":"营业利润 · 单季","zh":{"insight":"因为剔除了资本结构（借了多少钱）和税率差异，它比净利润更能反映\"这门生意本身\"赚不赚钱——比较不同杠杆、不同税收地区的公司时尤其重要。"},"en":{"insight":"Stripping out capital structure and tax rates makes it a cleaner read of the business itself — essential when comparing companies with different leverage or tax domiciles."}},"ind.OPERATINGPROFIT_FY":{"src":"ind","eid":"OPERATINGPROFIT_FY","cat":"income_statement","fam":"ratio-quality","bucket":"define","name":"Operating Profit · FY","nameZh":"营业利润 · 年度","zh":{"insight":"EV/EBIT ≈ 企业价值 ÷ 年度营业利润。选股筛选器常用它而不是 P/E，因为企业价值含负债、营业利润不受资本结构影响，两端口径一致，跨杠杆比较才成立。"},"en":{"insight":"Screens prefer EV/EBIT over P/E because enterprise value includes debt and operating profit is pre-financing, so both sides are consistent and the comparison survives different leverage."}},"ind.ROA_FQ":{"src":"ind","eid":"ROA_FQ","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Return on Assets · FQ","nameZh":"总资产收益率 · 单季","zh":{"insight":"与 ROE 不同，这里没有杠杆项：分母是整个资产基数，不区分是借来的还是股东的。"},"en":{"insight":""}},"ind.ROA_FY":{"src":"ind","eid":"ROA_FY","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Return on Assets · FY","nameZh":"总资产收益率 · 年度","zh":{"insight":"ROA 的绝对水平受行业绑定：银行天然低（资产表巨大），软件天然高（几乎没有实物资产），跨行业比较毫无意义。"},"en":{"insight":"The level is industry-bound — banks are structurally low, software structurally high — so compare within an industry."}},"ind.ROE_FQ":{"src":"ind","eid":"ROE_FQ","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Return on Equity · FQ","nameZh":"净资产收益率 · 单季","zh":{"insight":"季度口径是回报率的早期脉搏，但噪音大：单季权益是时点数，单季利润年化又会把季节性放大四倍。"},"en":{"insight":"The quarterly read is an early pulse but noisy: quarter-end equity is a snapshot and annualising one quarter multiplies its seasonality by four."}},"ind.ROIC_FY":{"src":"ind","eid":"ROIC_FY","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Return on Invested Capital · FY","nameZh":"投入资本回报率 · 年度","zh":{"insight":"如果 ROIC 低于 WACC，那么公司每增长一块钱都在毁灭价值——增长本身不是好事，只有回报率高于资本成本的增长才是。这是很多\"高增长故事\"最终失败的数学原因。"},"en":{"insight":"Operating profit, not net profit, so interest expense does not contaminate the return on the business itself."}},"ind.EBITTOREVENUE_FY":{"src":"ind","eid":"EBITTOREVENUE_FY","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"EBIT Margin · FY","nameZh":"息税前利润率 · 年度","zh":{"insight":"因此是跨公司比较经营效率时最公允的口径——同样的生意，一家借钱多、一家注册在低税区，净利率会差很多，EBIT 利润率却可比。"},"en":{"insight":"The fairest basis for comparing operating efficiency across companies: same business, different leverage or tax domicile, and net margin diverges while EBIT margin stays comparable."}},"ind.GROSSMARGIN_FQ":{"src":"ind","eid":"GROSSMARGIN_FQ","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Gross Margin · FQ","nameZh":"毛利率 · 单季","zh":{"insight":"要看同比以剔除季节性的成本结构差异（比如淡旺季产能利用率不同会直接影响单位成本）。"},"en":{"insight":"The quarterly margin is where an input-cost squeeze or a price cut shows up first — before net profit, and before management语言 changes."}},"ind.NAPERSHARE_FY":{"src":"ind","eid":"NAPERSHARE_FY","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Net Asset Value per Share · FY","nameZh":"每股净资产 · 年度","zh":{"insight":"既不是市场价值，也不是清算价值。轻资产公司（软件、品牌）的真实价值大量存在于不入表的无形资产里，用 P/B 给它们估值会严重失真。"},"en":{"insight":"Asset-light businesses hold most of their value in intangibles that never reach the balance sheet, so P/B misprices them badly."}},"ind.TAXRATE_FY":{"src":"ind","eid":"TAXRATE_FY","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Tax Rate · FY","nameZh":"实际税率 · 年度","zh":{"insight":"如果某个季度的利润\"超预期\"主要来自异常偏低的税率，那么这份超预期质量很低且不可持续——下个季度税率回归正常，利润就会打回原形。看到超预期先看税率，是识别虚假beat的常用手法。"},"en":{"insight":"A beat driven by an unusually low tax rate is low quality and will not repeat. Checking the tax line is a standard way to spot a hollow beat."}},"ind.CURRENTRATIO_FQ":{"src":"ind","eid":"CURRENTRATIO_FQ","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Current Ratio · FQ","nameZh":"流动比率 · 单季","zh":{"insight":"因此单季数字容易误导，真正有用的是跨季度的方向：是在持续改善还是持续恶化。"},"en":{"insight":""}},"ind.QUICKRATIO_FQ":{"src":"ind","eid":"QUICKRATIO_FQ","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Quick Ratio · FQ","nameZh":"速动比率 · 单季","zh":{"insight":"对存货占比高的行业（零售、制造），这个比率比流动比率有意义得多。"},"en":{"insight":"For inventory-heavy sectors this is far more informative than the current ratio."}},"ind.QUICKRATIO_FY":{"src":"ind","eid":"QUICKRATIO_FY","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Quick Ratio · FY","nameZh":"速动比率 · 年度","zh":{"insight":"速动比率与流动比率的差距，就是有多少流动性被压在存货里——差距越大，这家公司的短期偿付越依赖\"卖得掉货\"这个前提。"},"en":{"insight":"The gap between the two ratios is how much liquidity is locked in inventory, i.e. how much solvency depends on being able to sell it."}},"ind.FIXEDASSETSTO_FQ":{"src":"ind","eid":"FIXEDASSETSTO_FQ","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Fixed Asset Turnover · FQ","nameZh":"固定资产周转率 · 单季","zh":{"insight":"因此数值本身偏小、季节性强，并且主要被产能利用率的波动主导。单季看意义有限，应看同比。"},"en":{"insight":"One quarter of revenue over a slow-moving asset base: small, seasonal, and dominated by utilisation swings."}},"ind.FIXEDASSETSTO_FY":{"src":"ind","eid":"FIXEDASSETSTO_FY","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Fixed Asset Turnover · FY","nameZh":"固定资产周转率 · 年度","zh":{"insight":"高且稳定说明轻资产或产能利用充分；偏低说明重资本。注意重资本本身不是缺点，但它意味着更高的固定成本和更差的下行弹性——需求下滑时折旧和维护费不会跟着降。"},"en":{"insight":"Capital intensity is not itself a flaw, but it means higher fixed costs and worse downside flexibility — depreciation does not fall when demand does."}},"ind.INVENTORYTO_FQ":{"src":"ind","eid":"INVENTORYTO_FQ","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Inventory Turnover · FQ","nameZh":"存货周转率 · 单季","zh":{"insight":"这里用营业成本而不是收入做分子，是因为存货记的是成本口径，分子分母必须同口径才可比。"},"en":{"insight":"COGS, not revenue, because inventory is carried at cost — both sides of the ratio must be on the same basis."}},"ind.INVENTORYTO_FY":{"src":"ind","eid":"INVENTORYTO_FY","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Inventory Turnover · FY","nameZh":"存货周转率 · 年度","zh":{"insight":"趋势比绝对值更重要，且只在同业内可比：珠宝店的周转率天然远低于生鲜超市。"},"en":{"insight":"Inventory is cash already spent but not yet recovered, so faster turns mean less capital trapped."}},"ind.PAYABLETO_FQ":{"src":"ind","eid":"PAYABLETO_FQ","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Payable Turnover · FQ","nameZh":"应付账款周转率 · 单季","zh":{"insight":"这会占用供应商的资金来补自己的现金流。适度是议价能力强的体现，过度则可能损害供应商关系，甚至是自身资金紧张的信号——要结合现金流一起判断是\"强势\"还是\"没钱\"。"},"en":{"insight":"Stretching payables is supplier financing. Moderately it signals bargaining power; excessively it can signal distress — read it alongside cash flow to tell which."}},"ind.PAYABLETO_FY":{"src":"ind","eid":"PAYABLETO_FY","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Payable Turnover · FY","nameZh":"应付账款周转率 · 年度","zh":{"insight":"现金转换周期 = 存货天数 + 应收天数 − 应付天数。这个数字为负意味着公司先收到客户的钱、再付给供应商——等于用上下游的钱做免费营运资金，是极强的商业模式特征（典型如大型商超、平台电商）。"},"en":{"insight":"A negative cash conversion cycle means customers pay before suppliers do — the business runs on other people's working capital, a hallmark of grocers and platform retailers."}},"ind.RECEIVABLETO_FQ":{"src":"ind","eid":"RECEIVABLETO_FQ","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Receivable Turnover · FQ","nameZh":"应收账款周转率 · 单季","zh":{"insight":"这往往是需求走弱的早期信号；更糟的情况是公司为了做收入而放宽信用政策甚至提前确认收入——收入涨了、现金没进来。看到收入增长而应收增长更快时，要高度警惕。"},"en":{"insight":"An early tell of demand weakness — or worse, revenue being bought with loose credit terms. Revenue growing slower than receivables is the pattern to fear."}},"ind.RECEIVABLETO_FY":{"src":"ind","eid":"RECEIVABLETO_FY","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Receivable Turnover · FY","nameZh":"应收账款周转率 · 年度","zh":{"insight":"持续多年的下行趋势是严重的会计质量警告：它意味着账面上的收入正在越来越难变成现金，而这类问题通常在最终暴雷前已经在报表上显现了很久。"},"en":{"insight":"A multi-year downtrend is a serious accounting-quality warning: reported revenue is converting to cash ever more slowly, and this usually shows up in the statements long before anything breaks."}},"ind.TOTALASSETRATE_FY":{"src":"ind","eid":"TOTALASSETRATE_FY","cat":"key_indicators","fam":"ratio-quality","bucket":"define","name":"Asset Turnover · FY","nameZh":"总资产周转率 · 年度","zh":{"insight":"三项分别对应盈利能力、效率、杠杆。零售、分销这类薄利行业主要靠提高周转率来做出 ROE，而奢侈品、软件靠的是净利率——同样的 ROE 可以来自完全不同的商业模式。"},"en":{"insight":"Thin-margin retailers manufacture ROE through turnover; luxury and software do it through margin. The same ROE can come from opposite business models."}},"opt.DELTA":{"src":"opt","eid":"DELTA","cat":"greeks","fam":"greek-sense","bucket":"read","name":"Delta","nameZh":"Delta（对冲值）","zh":{"insight":"它等于等效股数——这是 Delta 最实用的读法：净 Delta 为 +59 就相当于此刻持有 59 股正股，无论你持有的是几张什么合约。风险管理应该以这个数字为准，而不是合约张数。"},"en":{"insight":"Position delta is the shares-equivalent. A net +59 delta behaves like 59 shares right now, whatever contracts produced it — size risk off this number, not off contract count."}},"opt.LONG_CALL":{"src":"opt","eid":"LONG_CALL","cat":"strat-bullish","fam":"payoff-structure","bucket":"trade","name":"Long Call","nameZh":"买入认购期权","zh":{"insight":"盈亏平衡 = 行权价 + 权利金。注意不是\"涨过行权价就赚\"——还要先赚回权利金。"},"en":{"insight":"Long direction AND long volatility at once, which is why being right on direction can still lose money when IV collapses."}},"opt.GAMMA":{"src":"opt","eid":"GAMMA","cat":"greeks","fam":"greek-sense","bucket":"read","name":"Gamma","nameZh":"Gamma（Delta 变化率）","zh":{"insight":"一次 ΔS 幅度的移动带来的凸性盈亏约为 ½·Γ·ΔS²×100（每张）。注意平方项：这就是为什么 Gamma 收益对大幅波动极其敏感，而对小幅震荡几乎无感。"},"en":{"insight":"Gamma explodes into expiry — the entire attraction and the entire danger of a 0DTE."}},"opt.THETA":{"src":"opt","eid":"THETA","cat":"greeks","fam":"greek-sense","bucket":"read","name":"Theta","nameZh":"Theta（时间价值衰减）","zh":{"insight":"⚠ 那个 ÷365 不是装饰：本页把 Theta 报价为每日历日，"},"en":{"insight":"A weekend costs two units of decay, not zero — market makers price it out before Friday's close."}},"opt.VEGA":{"src":"opt","eid":"VEGA","cat":"greeks","fam":"greek-sense","bucket":"read","name":"Vega","nameZh":"Vega（波动率敏感度）","zh":{"insight":"⚠ 那个 ÷100 很重要：本页把 Vega 报价为每 1 个波动率点"},"en":{"insight":"A parallel shift is the model's fiction. Real vol moves are skew and term-structure moves, so a single vega number leaves exposure you cannot see."}},"opt.RHO":{"src":"opt","eid":"RHO","cat":"greeks","fam":"greek-sense","bucket":"read","name":"Rho","nameZh":"Rho（利率敏感度）","zh":{"insight":"⚠ ÷100 表示口径是每 1 个百分点的无风险利率变动（3.80% → 4.80%）。"},"en":{"insight":"Differentiating parity in r shows rho is nothing more than the carry term; it carries no directional or volatility information."}},"opt.BEP":{"src":"opt","eid":"BEP","cat":"metrics","fam":"greek-sense","bucket":"read","name":"Break-Even Point","nameZh":"盈亏平衡点","zh":{"insight":"注意是到期时，不是持有期间——期权在到期前的市值曲线完全不同，盘中价格触及 BEP 并不代表你已经打平。"},"en":{"insight":"At expiry, not before — the mark-to-market curve before expiry is a different shape entirely."}},"opt.POP":{"src":"opt","eid":"POP","cat":"metrics","fam":"greek-sense","bucket":"read","name":"Probability of Profit","nameZh":"获利概率","zh":{"insight":"⚠ 请注意漂移用的是 r − q。你对方向的判断在这个公式里完全不出现——两个人对同一个结构有截然相反的看法，算出来的 POP 一模一样。"},"en":{"insight":"A high POP often comes with a violently asymmetric loss distribution. It says nothing about expected value."}},"opt.MAX_PL":{"src":"opt","eid":"MAX_PL","cat":"metrics","fam":"greek-sense","bucket":"read","name":"Max Profit / Max Loss","nameZh":"最大盈亏","zh":{"insight":"提前行权和钉价风险会打破这个假设：如果卖出腿被提前指派而买入腿还在，你会在一夜之间持有裸的正股头寸，\"有限风险\"当场失效。"},"en":{"insight":"Early assignment leaves you holding naked stock overnight while the long leg is still open, and the \"defined risk\" evaporates."}},"opt.ROR":{"src":"opt","eid":"ROR","cat":"metrics","fam":"greek-sense","bucket":"read","name":"Return on Risk","nameZh":"风险回报率","zh":{"insight":"ROR 描述的是一个零期望赌局的形状，而不是它的价值。525% 的 ROR 听起来很诱人，但它同时意味着赢的概率很低——两者是同一枚硬币。"},"en":{"insight":"ROR describes the SHAPE of a zero-expected-value bet, not its value. A 525% ROR is the same coin as a low probability of winning."}},"opt.ROC":{"src":"opt","eid":"ROC","cat":"metrics","fam":"greek-sense","bucket":"read","name":"Return on Collateral","nameZh":"保证金回报率","zh":{"insight":"分母是一项政策，而且它会随着头寸对你不利而盘中重算——这正是裸卖策略真正的风险所在：不是你算错了 ROC，而是市场下跌时券商会提高你的保证金要求，在最坏的时点逼你平仓。"},"en":{"insight":"The denominator is a policy, and it is recomputed intraday as the position moves against you — which is the real risk of naked selling: a margin call forcing you out at the worst moment."}},"opt.IV":{"src":"opt","eid":"IV","cat":"pricing","fam":"vol-regime","bucket":"read","name":"Implied Volatility","nameZh":"隐含波动率","zh":{"insight":"并插值到恒定 30 天期限——它描述的是这只股票，而不是某一张合约。"},"en":{"insight":"Three correct numbers describing three different objects. Always ask which one \"the stock's IV\" refers to."}},"opt.HV":{"src":"opt","eid":"HV","cat":"pricing","fam":"vol-regime","bucket":"read","name":"Historical Volatility","nameZh":"历史波动率","zh":{"insight":"并且这份贡献会在它滚出 30 日窗口的那一天整块消失。这就是等权移动窗口的固有缺陷：HV 会在某一天毫无理由地\"跳水\"，而市场其实什么都没发生。看 HV 的突变时，先确认是不是某根极端 K 线刚刚出窗。"},"en":{"insight":"The contribution vanishes in one block the day it rolls out of the window. An equally-weighted window makes HV drop for no market reason at all."}},"opt.IV_RANK":{"src":"opt","eid":"IV_RANK","cat":"pricing","fam":"vol-regime","bucket":"read","name":"IV Rank","nameZh":"IV 排名","zh":{"insight":"⚠ 它是一个极值统计量：整整一年的数据里，只有三个数字真正参与计算（当前、最高、最低）。"},"en":{"insight":"IV Rank halves on one day of data that has already passed and has no bearing on the present."}},"opt.IV_PCTL":{"src":"opt","eid":"IV_PCTL","cat":"pricing","fam":"vol-regime","bucket":"read","name":"IV Percentile","nameZh":"IV 百分位","zh":{"insight":"⚠ 它是一个计数统计量：252 个观测每一个都投一票，这与只看三个数的 IV Rank 有本质区别。"},"en":{"insight":"One outlier can shift IV Rank by 28 points and IV Percentile by at most 1/252. Percentile is the distributional statistic; rank is an extreme-value one."}},"opt.PREMIUM":{"src":"opt","eid":"PREMIUM","cat":"pricing","fam":"vol-regime","bucket":"read","name":"Premium","nameZh":"权利金","zh":{"insight":"验证：盈亏平衡点 901.06 = 881.47 ×(1 + 2.22%)。所以溢价率回答的是\"股价还要再涨多少百分比我才不亏\"，这才是它真正有用的读法。"},"en":{"insight":"The percentage answers \"how much further must the stock move before I stop losing\" — the only reading that is actually useful."}},"opt.INTRINSIC":{"src":"opt","eid":"INTRINSIC","cat":"pricing","fam":"vol-regime","bucket":"read","name":"Intrinsic Value","nameZh":"内在价值","zh":{"insight":"⚠ 注意：不含波动率、不含利率、不含时间、不含任何模型。它是纯粹的算术，是期权价值中唯一确定无疑的部分。"},"en":{"insight":"A deep in-the-money European put can trade below intrinsic because the strike is only received at expiry and must be discounted."}},"opt.EXTRINSIC":{"src":"opt","eid":"EXTRINSIC","cat":"pricing","fam":"vol-regime","bucket":"read","name":"Extrinsic (Time) Value","nameZh":"时间价值","zh":{"insight":"但注意：3 天 × 3.68 只有 11.05，而必须消失的是 19.59——所以 Theta 会在最后几天加速约一倍。线性外推 Theta 会严重低估临期损失。"},"en":{"insight":"63% of the price of an in-the-money option is time, not intrinsic."}},"opt.MONEYNESS":{"src":"opt","eid":"MONEYNESS","cat":"pricing","fam":"vol-regime","bucket":"read","name":"Moneyness (ITM / ATM / OTM)","nameZh":"价值状态（价内/平值/价外）","zh":{"insight":"交易台的惯例是按 Delta 报价而不是按标签：\"25 Delta 的认沽\"。因为 Delta 已经把行权距离、剩余时间、波动率三者合并成了一个可比的数字，而\"价外 5%\"在不同期限下含义完全不同。"},"en":{"insight":"Delta already folds distance, time and volatility into one comparable number, while \"5% out of the money\" means different things at different expiries."}},"opt.LEVERAGE":{"src":"opt","eid":"LEVERAGE","cat":"pricing","fam":"vol-regime","bucket":"read","name":"Leverage Ratio","nameZh":"杠杆比率","zh":{"insight":"杠杆比率 = 股价 ÷ 期权价格。⚠ 它完全不考虑 Delta，这正是问题所在。"},"en":{"insight":"The most \"leveraged\" contract on any screen is the one closest to being worth nothing. Selecting on this number systematically picks the contracts most likely to expire worthless."}},"opt.EFF_GEARING":{"src":"opt","eid":"EFF_GEARING","cat":"pricing","fam":"vol-regime","bucket":"read","name":"Effective Gearing","nameZh":"实际杠杆","zh":{"insight":"大跌时则远低于 17。Ω 是一条切线，不是收益曲线——用它线性外推大幅波动下的收益，会同时高估亏损和低估盈利。"},"en":{"insight":"Ω is a tangent line, not a payoff. Extrapolating it linearly across a large move overstates the loss and understates the gain."}},"opt.MARK_PRICE":{"src":"opt","eid":"MARK_PRICE","cat":"pricing","fam":"vol-regime","bucket":"read","name":"Mark Price vs Theoretical Price","nameZh":"标记价格与理论价格","zh":{"insight":"一个听起来吓人的 6.18% 的\"定价错误\"，在 3 天期合约上只不过是不到 6 个波动点——属于正常噪音。价格百分比会夸大短期合约的分歧，波动率单位才可比。"},"en":{"insight":"It means the true disagreement is larger, not smaller."}},"opt.STRIKE":{"src":"opt","eid":"STRIKE","cat":"contract","fam":"concept-trap","bucket":"define","name":"Strike Price","nameZh":"行权价","zh":{"insight":"MU 在 885 附近按 5 元一档挂牌。行权价不是连续的——这意味着你无法精确表达任意价格观点，只能在最近的挂牌档位上取舍。"},"en":{"insight":"The ladder is not continuous, so you cannot express an arbitrary price view — only the nearest listed step."}},"opt.EXPIRY":{"src":"opt","eid":"EXPIRY","cat":"contract","fam":"concept-trap","bucket":"define","name":"Expiration Date","nameZh":"到期日","zh":{"insight":"但 OCC 的行权申报截止是 17:30——注意你的券商截止时间更早。这个时间差每年都会让人措手不及。"},"en":{"insight":"\"In the money by a penny\" becomes 100 shares you did not plan for, and the capital to carry them."}},"opt.DTE":{"src":"opt","eid":"DTE","cat":"contract","fam":"concept-trap","bucket":"define","name":"Days to Expiration","nameZh":"剩余到期天数","zh":{"insight":"把 T 改成 2/365，面板上每一个希腊字母都会变。这不是小数点后的差别——在 3 天期合约上，一天就是三分之一的剩余寿命。"},"en":{"insight":"The SECOND half of an option's life carries 71% of the decay — the quantitative basis for not holding to the end."}},"opt.MULTIPLIER":{"src":"opt","eid":"MULTIPLIER","cat":"contract","fam":"concept-trap","bucket":"define","name":"Multiplier","nameZh":"合约乘数","zh":{"insight":"并且可能变成一笔 87,000 美元的股票买入。这三个数量级的跨度正是期权风险管理的核心——很多人只盯着第一个数字。"},"en":{"insight":"The three orders of magnitude between premium, delta notional and assignment obligation are the core of options risk. Most people watch only the first."}},"opt.CONTRACT_SIZE":{"src":"opt","eid":"CONTRACT_SIZE","cat":"contract","fam":"concept-trap","bucket":"define","name":"Contract Size","nameZh":"合约单位","zh":{"insight":"因此正确的对冲股数 = 张数 × 合约单位，不是张数 × 乘数。"},"en":{"insight":"A suffixed symbol always means an adjustment; look it up before trading it."}},"opt.STYLE":{"src":"opt","eid":"STYLE","cat":"contract","fam":"concept-trap","bucket":"define","name":"American vs European Style","nameZh":"美式与欧式","zh":{"insight":"因此提前行权永远不划算——那等于白白扔掉剩余的时间价值。这是新手最常犯的错误之一：拿着大幅盈利的认购迫不及待地行权，实际上直接卖出合约总是更优。"},"en":{"insight":"Which is why anyone short a deep in-the-money put must be ready for assignment at any time."}},"opt.PREV_CLOSE":{"src":"opt","eid":"PREV_CLOSE","cat":"contract","fam":"concept-trap","bucket":"define","name":"Previous Close & Settlement","nameZh":"昨收与结算价","zh":{"insight":"注意它是一个成交价，来自当时最后一笔交易发生的时刻，不是估值。"},"en":{"insight":"An option's percentage change divides by a small, decaying number. \"Up 300% today\" usually just means it was cheap yesterday."}},"opt.OPEN_INTEREST":{"src":"opt","eid":"OPEN_INTEREST","cat":"chain","fam":"chain-read","bucket":"read","name":"Open Interest","nameZh":"未平仓合约数","zh":{"insight":"⚠ 推论：成交量可以是持仓变化绝对值的任意倍数，甚至大很多倍。"},"en":{"insight":"Open interest carries NO direction information — it does not say who bought or who sold."}},"opt.VOLUME":{"src":"opt","eid":"VOLUME","cat":"chain","fam":"chain-read","bucket":"read","name":"Volume","nameZh":"成交量","zh":{"insight":"→ 当天约 99% 的交易是开仓后当天就平掉的。这类数据说明该行权价是日内投机的战场，而不是有人在建立仓位——两者对后市的含义完全不同。"},"en":{"insight":"Roughly 99% of the day's trading opened AND closed intraday — a day-trading battleground, not position building. The two have opposite implications."}},"opt.TURNOVER":{"src":"opt","eid":"TURNOVER","cat":"chain","fam":"chain-read","bucket":"read","name":"Turnover","nameZh":"成交额","zh":{"insight":"→ 在成交量排行上两者几乎相同，在金额上相差 14.7 倍。只看成交量排序，会把一堆几分钱的彩票误当成大资金动向。"},"en":{"insight":"Statistically identical on the volume rank, 14.7x apart in money. Sorting by contracts mistakes a pile of penny lottery tickets for institutional flow."}},"opt.PCR_VOL":{"src":"opt","eid":"PCR_VOL","cat":"chain","fam":"chain-read","bucket":"read","name":"Put/Call Ratio (Volume)","nameZh":"认沽认购比（成交量）","zh":{"insight":"因为机构常年买入指数认沽作为组合对冲——这是仓位需求，不是看空。"},"en":{"insight":"Institutions hold index puts as portfolio hedges — a positioning requirement, not a bearish view."}},"opt.PCR_OI":{"src":"opt","eid":"PCR_OI","cat":"chain","fam":"chain-read","bucket":"read","name":"Put/Call OI Ratio","nameZh":"认沽认购比（未平仓）","zh":{"insight":"那是一个中性偏空的头寸。所以一个高 PCR 完全可能是由大量卖出认沽（看多）构成的。不做拆解就下方向结论，是这个指标最常见的误用。"},"en":{"insight":"A high PCR can be built entirely from SOLD puts, which is a bullish position. Drawing a directional conclusion without the decomposition is the standard misuse."}},"opt.OI_CHANGE":{"src":"opt","eid":"OI_CHANGE","cat":"chain","fam":"chain-read","bucket":"read","name":"OI Rise / OI Fall","nameZh":"未平仓增减","zh":{"insight":"只有成交打印上的买卖方向标记才能消除这个歧义。所有\"持仓增加说明主力看多\"之类的解读，都跳过了这一步。"},"en":{"insight":"Only the bid/ask side tag resolves it. Every \"rising OI means smart money is bullish\" claim skips this step."}},"opt.MAX_PAIN":{"src":"opt","eid":"MAX_PAIN","cat":"chain","fam":"chain-read","bucket":"read","name":"Max Pain","nameZh":"最大痛点","zh":{"insight":"理解这一点后就会明白：所谓\"股价被吸向最大痛点\"的因果关系很可能是反的。"},"en":{"insight":"Into expiry it converges toward spot rather than the stock converging toward it — the causality is likely the reverse of the popular claim."}},"opt.VOL_OI_BY_STRIKE":{"src":"opt","eid":"VOL_OI_BY_STRIKE","cat":"chain","fam":"chain-read","bucket":"read","name":"Volume & OI by Strike","nameZh":"按行权价分布","zh":{"insight":"⚠ 两张图之间的差异才是这一天真正的故事——成交量图告诉你今天大家在赌什么，持仓图告诉你大家实际留下了什么。"},"en":{"insight":"The difference between the two charts IS the day's story: volume says what was gambled on, open interest says what was actually kept."}},"opt.GEX":{"src":"opt","eid":"GEX","cat":"analysis","fam":"chain-read","bucket":"read","name":"Gamma Exposure (GEX)","nameZh":"伽马敞口 (GEX)","zh":{"insight":"总额为负表示做市商净空 gamma，对冲行为变成涨了买、跌了卖，对价格起放大作用，波动被自我强化。这就是\"负 gamma 环境下容易出现单边暴走\"的机制解释。"},"en":{"insight":"The dealer-positioning assumption cannot be verified — real dealer books are not public. The reliability of all GEX analysis rests on it."}},"opt.CALL_GEX":{"src":"opt","eid":"CALL_GEX","cat":"analysis","fam":"chain-read","bucket":"read","name":"Call GEX (Call-Side Gamma Exposure)","nameZh":"认购伽马敞口","zh":{"insight":"⚠ 一个重要现象：某个行权价可能认购 GEX 很大而净额接近零，"},"en":{"insight":"The hedging pressure is real on both sides; only the residual shows up in the net, so a net-only view understates the flow at that strike."}},"opt.PUT_GEX":{"src":"opt","eid":"PUT_GEX","cat":"analysis","fam":"chain-read","bucket":"read","name":"Put GEX (Put-Side Gamma Exposure)","nameZh":"认沽伽马敞口","zh":{"insight":"⚠ 关键的数学事实：同一行权价、同一到期日的认购与认沽 Gamma 完全相等（由平价关系保证），"},"en":{"insight":"A large negative put GEX is the normal state of an equity chain, not a bearish reading — the most common misuse of this metric."}},"opt.AGG_GEX":{"src":"opt","eid":"AGG_GEX","cat":"analysis","fam":"chain-read","bucket":"read","name":"Aggregate GEX Curve","nameZh":"聚合伽马曲线","zh":{"insight":"而这张图要回答的问题恰恰就是\"股价移动之后会怎样\"。理解这个区别，才不会把静态柱状图当成动态预测。"},"en":{"insight":"Moving spot changes which strikes are at the money, and that is precisely the question the chart exists to answer."}},"opt.GAMMA_FLIP":{"src":"opt","eid":"GAMMA_FLIP","cat":"analysis","fam":"chain-read","bucket":"read","name":"Gamma Flip / Zero Gamma Level","nameZh":"伽马翻转位（零伽马线）","zh":{"insight":"这意味着\"视野内没有翻转点\"，而不是\"不存在翻转点\"。把 null 读成\"没有翻转\"是错误的——很可能只是绘图区间不够宽。"},"en":{"insight":"A null means \"no flip IN VIEW\", not \"no flip exists\" — usually the plotted range is simply too narrow."}},"opt.CALL_WALL":{"src":"opt","eid":"CALL_WALL","cat":"analysis","fam":"chain-read","bucket":"read","name":"Call Wall","nameZh":"认购墙","zh":{"insight":"也不是大家嘴上谈论的那个整数关口。三者经常不重合，混用会得出完全不同的结论。"},"en":{"insight":"Beyond about 5% on a front weekly, gamma there is negligible and the bar reflects open interest rather than hedging pressure."}},"opt.PUT_WALL":{"src":"opt","eid":"PUT_WALL","cat":"analysis","fam":"chain-read","bucket":"read","name":"Put Wall","nameZh":"认沽墙","zh":{"insight":"一道位于 gamma 翻转点下方的认沽墙不是\"支撑力弱一些\"，"},"en":{"insight":"It does not weakly support; it actively reverses function. Report the wall and the flip together or not at all."}},"opt.VOL_SMILE":{"src":"opt","eid":"VOL_SMILE","cat":"analysis","fam":"chain-read","bucket":"read","name":"Volatility Smile / Skew","nameZh":"波动率微笑与偏斜","zh":{"insight":"会得到四位数的隐含波动率。那是算术假象，不是预测。看到极端行权价上的天价 IV，先怀疑分母而不是市场。"},"en":{"insight":"A four-digit IV at a far wing is an arithmetic artefact. Suspect the denominator before believing the market."}},"opt.VOL_TERM":{"src":"opt","eid":"VOL_TERM","cat":"analysis","fam":"chain-read","bucket":"read","name":"Volatility Term Structure","nameZh":"波动率期限结构","zh":{"insight":"⚠ 关键性质：方差随时间可加，这正是把事件从背景中剥离出来的办法："},"en":{"insight":"This is what a calendar spread actually trades, not the two quoted numbers."}},"opt.ZERO_DTE":{"src":"opt","eid":"ZERO_DTE","cat":"concepts","fam":"greek-sense","bucket":"read","name":"Zero Days to Expiration (0DTE)","nameZh":"零日期权（当日到期期权）","zh":{"insight":"⚠ 注意这就是整个头寸的价值——下面没有任何内在价值作为垫底。所以 0DTE 平价合约归零是常态而非意外。"},"en":{"insight":"Gamma is at its maximum here, so the hedging term is too — the direct cause of violent late-session moves when 0DTE volume piles up."}},"opt.IV_CRUSH":{"src":"opt","eid":"IV_CRUSH","cat":"concepts","fam":"vol-regime","bucket":"read","name":"IV Crush","nameZh":"波动率崩塌（IV 崩塌）","zh":{"insight":"⚠ 方差随时间可加，这是把事件从基础波动中分离出来的唯一正确方法："},"en":{"insight":"Do this BEFORE you buy. The answer is usually close to the implied event move itself, meaning the market has already priced the gap you are hoping for."}},"opt.UNUSUAL_ACTIVITY":{"src":"opt","eid":"UNUSUAL_ACTIVITY","cat":"concepts","fam":"concept-trap","bucket":"define","name":"Unusual Options Activity","nameZh":"期权异动大单","zh":{"insight":"⚠ 成交在中间价、大宗交叉或场内撮合 → 属于事先谈好的交易，这个标签几乎不含信息。看到 MID/CROSS 标签时不应做方向推断。"},"en":{"insight":"A two-bit lookup, not an inference — it knows nothing about the role the trade plays in a position."}},"opt.TOP_OPTIONS":{"src":"opt","eid":"TOP_OPTIONS","cat":"concepts","fam":"concept-trap","bucket":"define","name":"Top Options Screens","nameZh":"期权榜单","zh":{"insight":"成交量排名低 + 成交额排名高 → 少量、大额、昂贵的合约，是真正的资金规模。只看单一榜单会系统性地把前者误认为后者。"},"en":{"insight":"Reading a single ranking systematically mistakes retail lottery flow for institutional size."}},"opt.ASSIGNMENT":{"src":"opt","eid":"ASSIGNMENT","cat":"concepts","fam":"concept-trap","bucket":"define","name":"Assignment & Exercise","nameZh":"行权与被指派","zh":{"insight":"⚠ OCC 的例外行权：收盘时价内 ≥ 0.01 美元即自动行权。"},"en":{"insight":"If you do not hold the shares, this leaves you short 100."}},"opt.PIN_RISK":{"src":"opt","eid":"PIN_RISK","cat":"concepts","fam":"concept-trap","bucket":"define","name":"Pin Risk","nameZh":"钉扎风险","zh":{"insight":"⚠ 相反指令：买方可以放弃一张价内期权，也可以行权一张价外期权。"},"en":{"insight":"You do not know p — which is the whole point. Pin risk is not a priceable risk, it is missing information."}},"opt.LIQUIDITY":{"src":"opt","eid":"LIQUIDITY","cat":"concepts","fam":"concept-trap","bucket":"define","name":"Liquidity & Bid-Ask Spread","nameZh":"流动性与买卖价差","zh":{"insight":"⚠ 用中间价计价会永远高估盈亏，高估的幅度正好是（价差 ÷ 2）× 100 × 张数。账户里显示的浮盈里有一部分是永远拿不到的。"},"en":{"insight":"If the mid sits far from the VWAP, the quote is decorative — posted, but not where anyone trades."}},"opt.PROB_ANALYSIS":{"src":"opt","eid":"PROB_ANALYSIS","cat":"concepts","fam":"concept-trap","bucket":"define","name":"Probability Analysis","nameZh":"概率分析","zh":{"insight":"⚠ 也就是说分布的中心位于现价下方 8.2%。这来自 −σ²/2·T 这一项，是对数正态分布的数学性质，不是任何看空观点。波动率越高、时间越长，这个偏移越大。很多人看到\"中位数低于现价\"就以为模型在看空，这是误读。"},"en":{"insight":"That is −σ²/2·T, a property of the lognormal, not a view. The higher the volatility and the longer the horizon, the larger the offset."}},"opt.EXPECTED_MOVE":{"src":"opt","eid":"EXPECTED_MOVE","cat":"concepts","fam":"concept-trap","bucket":"define","name":"Expected Move","nameZh":"预期波动幅度","zh":{"insight":"⚠ 这是零漂移对数正态下 E|S_T − S| 的精确值，即 0.80σ，不是 1σ。"},"en":{"insight":"You need more than the market has already priced — the trade requires the market to be more extreme than its own expectation."}},"opt.TA_ON_OPTIONS":{"src":"opt","eid":"TA_ON_OPTIONS","cat":"concepts","fam":"concept-trap","bucket":"define","name":"Do Stock Indicators Transfer to Options?","nameZh":"股票指标在期权上通用吗","zh":{"insight":"期权价格里的\"趋势\"主要由 Δ·dS 和 Θ·dt 主导，而不是对该合约的供需。"},"en":{"insight":"RSI drifts down mechanically on any contract that simply gets older — it is measuring time passing, not selling pressure."}},"opt.SHORT_PUT":{"src":"opt","eid":"SHORT_PUT","cat":"strat-bullish","fam":"payoff-structure","bucket":"trade","name":"Short Put","nameZh":"卖出认沽期权","zh":{"insight":"⚠ 最大亏损 =（行权价 − 权利金）× 100，发生在股价归零时，中途没有任何东西能阻止它。"},"en":{"insight":"The maximum loss is over three times the margin posted — margin is not your risk ceiling."}},"opt.CASH_SECURED_PUT":{"src":"opt","eid":"CASH_SECURED_PUT","cat":"strat-bullish","fam":"payoff-structure","bucket":"trade","name":"Cash-Secured Put","nameZh":"现金担保认沽","zh":{"insight":"⚠ 简单年化 = 回报率 × 365 ÷ 天数，它是对最好情况的外推，不是收益率。"},"en":{"insight":"Both are arithmetic, not income. They assume 26 consecutive repeats at identical terms, and one large drawdown ends the sequence."}},"opt.COVERED_CALL":{"src":"opt","eid":"COVERED_CALL","cat":"strat-bullish","fam":"payoff-structure","bucket":"trade","name":"Long Covered Call","nameZh":"备兑认购","zh":{"insight":"平衡点 863.27，最大盈利 14,173，最大亏损 86,327，风险回报比 16.42%。"},"en":{"insight":"Long stock plus short call IS short put plus a bond. People who call the first conservative and the second dangerous are describing the same payoff."}},"opt.LONG_CALL_SPREAD":{"src":"opt","eid":"LONG_CALL_SPREAD","cat":"strat-bullish","fam":"payoff-structure","bucket":"trade","name":"Long Call Spread (Bull Call Spread)","nameZh":"认购牛市价差","zh":{"insight":"⚠ 关键的希腊字母对比：970/1070 这样的宽价差保留了裸认购 49% 的 vega 和 52% 的 theta。"},"en":{"insight":"A tight spread hedges away almost all vega and theta. That is the quantitative basis for using spreads in high IV and single legs in low IV."}},"opt.SHORT_PUT_SPREAD":{"src":"opt","eid":"SHORT_PUT_SPREAD","cat":"strat-bullish","fam":"payoff-structure","bucket":"trade","name":"Short Put Spread (Bull Put Spread)","nameZh":"认沽牛市价差","zh":{"insight":"⚠ 一个重要的近似恒等式：对接近二元的收益结构，风险回报比 ≈（1 − 盈利概率）÷ 盈利概率。这意味着回报率与概率在风险中性下互为倒数关系，你无法同时提高两者——任何声称\"高胜率高赔率\"的结构都值得先怀疑定价。"},"en":{"insight":"That is not a conventional credit spread but a synthetic long stock with a floor. Read the legs, not the strategy name."}},"opt.SYNTHETIC_LONG":{"src":"opt","eid":"SYNTHETIC_LONG","cat":"strat-bullish","fam":"payoff-structure","bucket":"trade","name":"Synthetic Long Stock","nameZh":"合成多头","zh":{"insight":"⚠ 净支出因此只包含持有成本，不含任何波动率成分——两条腿的 vega 完全抵消。"},"en":{"insight":"The leverage comes from margin, not from the options. A drawdown brings the same margin pressure as real stock, without the dividend or the vote."}},"opt.IRON_CONDOR":{"src":"opt","eid":"IRON_CONDOR","cat":"strat-basics","fam":"payoff-structure","bucket":"trade","name":"Iron Condor","nameZh":"铁鹰式","zh":{"insight":"⚠ 最大盈利是一个平台而不是一个点：终值落在两个卖出腿之间的任何位置都拿满。这是它相对铁蝶的关键优势。"},"en":{"insight":"A plateau, not a point — the key advantage over the iron butterfly."}},"opt.IRON_BUTTERFLY":{"src":"opt","eid":"IRON_BUTTERFLY","cat":"strat-basics","fam":"payoff-structure","bucket":"trade","name":"Iron Butterfly","nameZh":"铁蝶式","zh":{"insight":"⚠ 最大盈利只在终值恰好等于主体行权价时取得，是一个点而不是平台——这是它与铁鹰最本质的差别，也是它收入更高的原因。"},"en":{"insight":"A point, not a plateau — the essential difference from the condor and the reason it collects more."}},"opt.SYNTHETIC_PUT":{"src":"opt","eid":"SYNTHETIC_PUT","cat":"strat-basics","fam":"payoff-structure","bucket":"trade","name":"Synthetic Put (Short Stock + Long Call)","nameZh":"合成认沽","zh":{"insight":"⚠ 最大亏损被认购封顶——这正是给空头加买认购的全部意义：把无限的上行风险变成有限的。"},"en":{"insight":"The synthetic also pays stock borrow, which a long put does not. On hard-to-borrow names the outright put is almost always better."}},"opt.PROTECTIVE_PUT":{"src":"opt","eid":"PROTECTIVE_PUT","cat":"strat-basics","fam":"payoff-structure","bucket":"trade","name":"Protective Put","nameZh":"保护性认沽","zh":{"insight":"⚠ 最大亏损被锁定在行权价这个地板上，无论股价跌到哪里。这是它与备兑认购最根本的区别：后者只提供一点点缓冲，前者提供真正的下限。"},"en":{"insight":"Which is why permanent hedging is mathematically unworkable — the premium consumes most of the equity return. Protective puts are an event tool, not a standing allocation."}},"opt.SHORT_STRADDLE":{"src":"opt","eid":"SHORT_STRADDLE","cat":"strat-neutral","fam":"payoff-structure","bucket":"trade","name":"Short Straddle","nameZh":"卖出跨式","zh":{"insight":"⚠ 只能算抵押品回报率——风险回报比不存在，因为风险没有定义。任何给出这类结构\"风险回报比\"的软件都在误导你。"},"en":{"insight":"No return-on-risk exists because risk is not defined. Any software printing one for this structure is misleading you."}},"opt.SHORT_STRANGLE":{"src":"opt","eid":"SHORT_STRANGLE","cat":"strat-neutral","fam":"payoff-structure","bucket":"trade","name":"Short Strangle","nameZh":"卖出宽跨式","zh":{"insight":"⚠ 最大盈利是一个平台：终值落在两个行权价之间任何位置都拿满，这是它优于跨式的地方。"},"en":{"insight":"Identical. A strangle is not a safer straddle; it trades payout for probability and leaves the catastrophic tail untouched."}},"opt.LONG_CALL_BFLY":{"src":"opt","eid":"LONG_CALL_BFLY","cat":"strat-neutral","fam":"payoff-structure","bucket":"trade","name":"Long Call Butterfly","nameZh":"买入认购蝶式","zh":{"insight":"⚠ 净支出对凸的波动率微笑恒为正——这正是\"微笑\"的数学含义：中间的隐含波动率低于两翼，所以卖中间买两翼必然净付出。"},"en":{"insight":"A butterfly bets cheaply on a precise level, requiring both the price and the timing to be right — hence the structurally low hit rate."}},"opt.LONG_PUT_BFLY":{"src":"opt","eid":"LONG_PUT_BFLY","cat":"strat-neutral","fam":"payoff-structure","bucket":"trade","name":"Long Put Butterfly","nameZh":"买入认沽蝶式","zh":{"insight":"⚠ 风险回报比 196.88% 对认购蝶的 186.13%——这个差异来自每股 1.50 的报价差，不是策略差异。两者理论上等价，实际选哪个应该看哪一组腿的买卖价差更窄、流动性更好。"},"en":{"insight":"A 1.50/share price gap, not a strategy gap. Choose whichever set of legs has the tighter market."}},"opt.SHORT_IRON_BFLY":{"src":"opt","eid":"SHORT_IRON_BFLY","cat":"strat-neutral","fam":"payoff-structure","bucket":"trade","name":"Short Iron Butterfly","nameZh":"卖出铁蝶式","zh":{"insight":"铁蝶便宜 72.50，原因纯粹是它的四条腿全部是虚值，买卖价差更窄、流动性更好。这就是实务中偏好铁式结构的真正理由——不是策略更优，而是执行成本更低。"},"en":{"insight":"The iron version is cheaper purely because all four legs are out of the money and therefore more liquid. The preference is about execution cost, not strategy."}},"opt.SHORT_IRON_CONDOR":{"src":"opt","eid":"SHORT_IRON_CONDOR","cat":"strat-neutral","fam":"payoff-structure","bucket":"trade","name":"Short Iron Condor","nameZh":"卖出铁鹰式","zh":{"insight":"净收入结构，盈利在中间。注意各家券商对\"Short/Long 铁鹰\"的命名不一致，看腿不要看名字。"},"en":{"insight":"Brokers disagree on which of these is \"short\" — read the legs, not the name."}},"opt.LONG_STRADDLE":{"src":"opt","eid":"LONG_STRADDLE","cat":"strat-directional","fam":"payoff-structure","bucket":"trade","name":"Long Straddle","nameZh":"买入跨式","zh":{"insight":"⚠ 反解出跨式隐含的波动率：把支出比例除以 0.7979 再年化，得到约 80.9%。这是判断跨式贵不贵最直接的方法——把它与该标的的历史波动率对比，就知道市场要价是否合理。"},"en":{"insight":"It is NOT a max-profit ratio; the maximum is unbounded. Always ask at which price a printed return was evaluated."}},"opt.LONG_STRANGLE":{"src":"opt","eid":"LONG_STRANGLE","cat":"strat-directional","fam":"payoff-structure","bucket":"trade","name":"Long Strangle","nameZh":"买入宽跨式","zh":{"insight":"⚠ 最大亏损是一个平台：终值落在两个行权价之间的任何位置，整笔支出全部损失。"},"en":{"insight":"The straddle pays a flat 110 more outside the wings and loses 1,890 more inside them."}},"opt.SHORT_CALL_BFLY":{"src":"opt","eid":"SHORT_CALL_BFLY","cat":"strat-directional","fam":"payoff-structure","bucket":"trade","name":"Short Call Butterfly","nameZh":"卖出认购蝶式","zh":{"insight":"⚠ 镜像关系：同样四张合约反向持有，就是赔付 5,857.50、risking 1,642.50，"},"en":{"insight":"Identical coin, opposite clothes. High-hit-rate-low-payout and low-hit-rate-high-payout are two statements of the same price."}},"opt.SHORT_PUT_BFLY":{"src":"opt","eid":"SHORT_PUT_BFLY","cat":"strat-directional","fam":"payoff-structure","bucket":"trade","name":"Short Put Butterfly","nameZh":"卖出认沽蝶式","zh":{"insight":"⚠ 由平价关系，对称的空头认沽蝶与空头认购蝶在同样行权价上是同一个头寸。"},"en":{"insight":"By parity, a symmetric short put fly and short call fly at the same strikes are the SAME position."}},"opt.LONG_IRON_BFLY":{"src":"opt","eid":"LONG_IRON_BFLY","cat":"strat-directional","fam":"payoff-structure","bucket":"trade","name":"Long Iron Butterfly","nameZh":"买入铁蝶式","zh":{"insight":"⚠ 其他券商把完全相同的这组腿称为空头铁蝶。命名混乱是常态，永远看腿。"},"en":{"insight":"If you do not expect a move beyond about 17%, the iron fly dominates the straddle at equal capital."}},"opt.LONG_IRON_CONDOR":{"src":"opt","eid":"LONG_IRON_CONDOR","cat":"strat-directional","fam":"payoff-structure","bucket":"trade","name":"Long Iron Condor","nameZh":"买入铁鹰式","zh":{"insight":"并且在以现价为中心、宽达 40 点的平台内会亏掉全部支出。这类结构只有在你确信会出现大幅位移时才成立，用它来\"赌波动\"而位移不足，是最常见的亏损方式。"},"en":{"insight":"Risking 3.22 to make 1, and losing the FULL debit anywhere in a 40-point plateau centred on spot."}},"opt.LONG_PUT":{"src":"opt","eid":"LONG_PUT","cat":"strat-bearish","fam":"payoff-structure","bucket":"trade","name":"Long Put","nameZh":"买入认沽期权","zh":{"insight":"⚠ 最大盈利 =（行权价 − 权利金）× 100，有界——因为股价最低只能到零。这与买认购的无限上行不同，是认沽最本质的不对称。"},"en":{"insight":"On a long call the two fight each other, which is why put payoffs in a crash often exceed the delta estimate."}},"opt.SHORT_CALL":{"src":"opt","eid":"SHORT_CALL","cat":"strat-bearish","fam":"payoff-structure","bucket":"trade","name":"Short Call (Naked / Uncovered)","nameZh":"卖出认购期权（裸卖）","zh":{"insight":"⚠ 最大亏损无限——股价没有上界。这是所有期权结构中风险最极端的一个。"},"en":{"insight":"The mechanism that forces you out at the worst available price. Not being wrong on direction, but being made to quit at the most expensive moment."}},"opt.SHORT_CALL_SPREAD":{"src":"opt","eid":"SHORT_CALL_SPREAD","cat":"strat-bearish","fam":"payoff-structure","bucket":"trade","name":"Short Call Spread (Bear Call Spread)","nameZh":"认购熊市价差","zh":{"insight":"抵押品为宽度扣除收入——亏损是预先冻结的，不是逐日盯市追加，这是有界结构最大的实务优势。"},"en":{"insight":"Two tickets under one strategy name with entirely different risk. Read the legs."}},"opt.LONG_PUT_SPREAD":{"src":"opt","eid":"LONG_PUT_SPREAD","cat":"strat-bearish","fam":"payoff-structure","bucket":"trade","name":"Long Put Spread (Bear Put Spread)","nameZh":"认沽熊市价差","zh":{"insight":"⚠ 与同一屏上裸买 790 认沽的完整对比，这是最有价值的一段："},"en":{"insight":"An IV collapse barely marks the package — the quantitative case for spreads in high IV."}},"opt.SYNTHETIC_SHORT":{"src":"opt","eid":"SYNTHETIC_SHORT","cat":"strat-bearish","fam":"payoff-structure","bucket":"trade","name":"Synthetic Short Stock","nameZh":"合成空头","zh":{"insight":"⚠ 与直接融券做空 100 股的逐项对比，这才是选择它的实际理由："},"en":{"insight":"You are short at the forward, not at spot."}},"opt.COLLAR":{"src":"opt","eid":"COLLAR","cat":"strat-advanced","fam":"payoff-structure","bucket":"trade","name":"Collar","nameZh":"领口","zh":{"insight":"⚠ 从平价关系看：持股 + 买认沽 − 卖认购 是一个有界头寸，"},"en":{"insight":"The collar is the parity identity with the two strikes pulled apart — neither free insurance nor free income."}},"opt.CALENDAR_SPREAD":{"src":"opt","eid":"CALENDAR_SPREAD","cat":"strat-advanced","fam":"payoff-structure","bucket":"trade","name":"Calendar Spread (Long Call Calendar)","nameZh":"日历价差","zh":{"insight":"⚠ 若远月波动率下降 10 个点，区间收窄到 791.38–996.88，峰值也降到 +3,873——同样的股价路径，只因远月 IV 变化，结果就明显变差。这就是\"日历价差本质是在交易远期波动率\"的实证含义。"},"en":{"insight":"The chain-wide blend is not the front-expiry number."}},"opt.DIAGONAL_SPREAD":{"src":"opt","eid":"DIAGONAL_SPREAD","cat":"strat-advanced","fam":"payoff-structure","bucket":"trade","name":"Diagonal Spread (Poor Man's Covered Call)","nameZh":"对角价差","zh":{"insight":"⚠ 但必须算清最坏情况：若在 925 被行权，强制的内在价值只有 32,500，"},"en":{"insight":"The roll COUNT is the trade, not one roll."}},"ord.MARKET":{"src":"ord","eid":"MARKET","cat":"basic","fam":"order-fill","bucket":"trade","name":"Market Order (MKT)","nameZh":"市价单","zh":{"insight":"成交均价 = 各档（数量 × 价格）之和 ÷ 总数量。⚠ 注意你拿到的是加权均价，不是你看到的那个最优价——只有第一档按最优价成交。"},"en":{"insight":"You receive a size-weighted average, not the top-of-book price you saw — only the first level trades there."}},"ord.SLIPPAGE":{"src":"ord","eid":"SLIPPAGE","cat":"mechanics","fam":"order-fill","bucket":"trade","name":"Slippage & Market Impact","nameZh":"滑点与冲击成本","zh":{"insight":"⚠ 这个符号约定使得正值在买卖两侧都表示更差，因此可以直接横向比较。"},"en":{"insight":"It charges you for the fills you did NOT get. Measuring only executed slippage flatters passive strategies whose real cost is the trades they missed."}},"ord.LIMIT":{"src":"ord","eid":"LIMIT","cat":"basic","fam":"order-fill","bucket":"trade","name":"Limit Order (LMT)","nameZh":"限价单","zh":{"insight":"但带有一个硬性的最差价格保护。两者的风险完全不同，用同一个名字是交易术语中最容易误导新手的地方之一。"},"en":{"insight":"A limit protects you from paying more; it does not hand you the better price the gap printed."}},"ord.STOP":{"src":"ord","eid":"STOP","cat":"basic","fam":"order-fill","bucket":"trade","name":"Stop Order (STP) — stop-loss / stop-market","nameZh":"止损单","zh":{"insight":"有的用买一价（卖出止损）或卖一价（买入止损）。这不是同一个订单——同样的行情下，两种规则的触发时点可能相差很远。下单前必须确认你的券商用哪一种。"},"en":{"insight":"They are not the same order — the trigger moment can differ substantially under identical price action."}},"ord.STOP_LIMIT":{"src":"ord","eid":"STOP_LIMIT","cat":"basic","fam":"order-fill","bucket":"trade","name":"Stop Limit Order (STL)","nameZh":"止损限价单","zh":{"insight":"⚠ 结论：高于跳空开盘价，你什么都得不到；等于或低于它，你得到的几乎和普通止损一样。"},"en":{"insight":"For most retail size, what a stop-limit provides in a gap is not a better price but no fill at all."}},"ord.TRAILING_STOP":{"src":"ord","eid":"TRAILING_STOP","cat":"basic","fam":"order-fill","bucket":"trade","name":"Trailing Stop (TS)","nameZh":"跟踪止损单","zh":{"insight":"⚠ 它锁定的不是利润，而是一个触发价位。成交价仍然由盘口决定。"},"en":{"insight":"It does not lock in profit. It locks in a TRIGGER LEVEL, and the fill is still whatever the book pays."}},"ord.TRAILING_STOP_LIMIT":{"src":"ord","eid":"TRAILING_STOP_LIMIT","cat":"basic","fam":"order-fill","bucket":"trade","name":"Trailing Stop Limit (TSL)","nameZh":"跟踪止损限价单","zh":{"insight":"⚠ 结论极其清晰：在所有普通触发的情形下，加限价没有任何影响；"},"en":{"insight":"Widening the offset does not help — the gap is six dollars wide."}},"ord.TWAP":{"src":"ord","eid":"TWAP","cat":"basic","fam":"order-fill","bucket":"trade","name":"TWAP — Time-Weighted Average Price","nameZh":"时间加权平均价格单","zh":{"insight":"⚠ 注意每个子单都要付一次价差——切得越碎，价差成本反而累积得越多。"},"en":{"insight":"Every child pays the spread again — slicing finer accumulates more spread cost, not less."}},"ord.VWAP":{"src":"ord","eid":"VWAP","cat":"basic","fam":"order-fill","bucket":"trade","name":"VWAP — Volume-Weighted Average Price","nameZh":"成交量加权平均价格单","zh":{"insight":"你的得分 = 成交均价与当日 VWAP 之差，卖出时符号取反。⚠ 注意这意味着算法的目标是\"贴近均价\"，而不是\"拿到好价格\"——在单边下跌中，完美达成 VWAP 依然是亏损的执行。"},"en":{"insight":"The goal is to match the average, NOT to get a good price. Perfectly achieving VWAP in a one-way decline is still a losing execution."}},"ord.BRACKET_OCO":{"src":"ord","eid":"BRACKET_OCO","cat":"basic","fam":"order-fill","bucket":"trade","name":"Bracket / One-Cancels-the-Other (OCO)","nameZh":"止盈止损括号单 (OCO)","zh":{"insight":"部分成交：⚠ 如果母单只成交了一部分，子单可能仍按全额数量挂着——"},"en":{"insight":"A naked position waiting to happen. Check the child quantity whenever the parent fills partially."}},"ord.MOC":{"src":"ord","eid":"MOC","cat":"moomoo","fam":"order-fill","bucket":"trade","name":"Market On Close (MOC)","nameZh":"收盘市价单","zh":{"insight":"⚠ 因此这个模型给了集合竞价无限深度。真实的收盘竞价并非如此："},"en":{"insight":"Using MOC for size hides your impact cost rather than removing it."}},"ord.MIT":{"src":"ord","eid":"MIT","cat":"moomoo","fam":"order-fill","bucket":"trade","name":"Market-if-Touched (MIT)","nameZh":"触及市价单","zh":{"insight":"⚠ 它是止损单的镜像。买入止损挂在上方，在价格离你而去时触发；"},"en":{"insight":"Read the fill, not the label; the substance is the missing clamp."}},"ord.LIT":{"src":"ord","eid":"LIT","cat":"moomoo","fam":"order-fill","bucket":"trade","name":"Limit-if-Touched (LIT)","nameZh":"触及限价单","zh":{"insight":"⚠ 跳空既武装了它，也搁浅了它：市场在你的触发位下方重新开盘，订单被激活——"},"en":{"insight":"Nothing tells you your entry has evaporated."}},"ord.POV":{"src":"ord","eid":"POV","cat":"moomoo","fam":"order-fill","bucket":"trade","name":"Percentage of Volume (POV)","nameZh":"参与成交量比例单","zh":{"insight":"⚠ 转化：一串小市价单，其规模由市场决定，而不是由你决定。这是它与 TWAP/VWAP 最根本的差别——后两者你至少知道会分几次，POV 连这个都不确定。"},"en":{"insight":"The size is set by the market, not by you — unlike TWAP or VWAP where you at least know the schedule."}},"ord.HK_AUCTION_MKT":{"src":"ord","eid":"HK_AUCTION_MKT","cat":"tiger","fam":"order-fill","bucke ⚠ 三者在同一本盘口（你的价格内只有 1,100 股）上的差别："},"en":{"insight":"Which is why size uses IOC rather than a limit — not to fill, but to avoid showing intent."}},"ord.ORDER_BOOK":{"src":"ord","eid":"ORDER_BOOK","cat":"mechanics","fam":"order-fill","bucket":"trade","name":"The Order Book & Queue Priority","nameZh":"盘口与排队优先级","zh":{"insight":"⚠ 因此一张挂单是队列中的一个位置，而不仅仅是一个价格。理解这一点，才明白为什么\"我挂在最优价却没成交\"。"},"en":{"insight":"A resting order is a POSITION IN A QUEUE, not a price."}},"ord.SESSIONS":{"src":"ord","eid":"SESSIONS","cat":"mechanics","fam":"order-fill","bucket":"trade","name":"Trading Sessions & Auctions","nameZh":"交易时段与集合竞价","zh":{"insight":"⇒ 两端每根的成交量约是中间的 3.5 倍。这解释了为什么大单要在开盘和收盘附近做。"},"en":{"insight":"Your stop was not broken; it was asleep during the only hours that mattered."}},"ord.FILLS":{"src":"ord","eid":"FILLS","cat":"mechanics","fam":"order-fill","bucket":"trade","name":"Fills, Partial Fills & Average Price","nameZh":"成交、部分成交与均价","zh":{"insight":"均价 = Σ(数量 × 价格) ÷ Σ数量，不是各笔价格的算术平均。"},"en":{"insight":"Never re-send an order because a screen has not caught up — the classic and expensive duplicate-order accident."}},"ord.MAKER_TAKER":{"src":"ord","eid":"MAKER_TAKER","cat":"mechanics","fam":"order-fill","bucket":"trade","name":"Maker / Taker & Execution Cost","nameZh":"挂单/吃单与交易成本","zh":{"insight":"不需要任何数据权限，也不依赖任何理论。这是评估券商执行质量最朴素也最可靠的方法。"},"en":{"insight":"Adverse selection and the cost of not trading are the real risks of posting, and neither appears on any fee schedule."}}};}(globalThis));</script>
<script>/* =============================================================================
   families.js — lesson generation for the full 302-entry corpus.

   A lesson is generated from (entry, family). Three rules govern this file:

   1. THE LESSON KIND FOLLOWS WHAT THE ENTRY SUPPORTS.
        bucket 'trade'  a fill or a P/L can honestly be produced on a tape
        bucket 'read'   the reading IS the exercise — no fill, no P/L
        bucket 'define' interpretation only; a fundamentals ratio has no tape
                        and inventing one would be fabrication

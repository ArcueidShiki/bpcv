<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Guided trading simulator — learn order types, indicator timing and option structures by trading scripted market regimes, with the counterfactual replayed on the identical price path.">
<title>Trading Playground · 交易模拟训练场</title>
<style>/* =============================================================================
   playground.css — same moomoo-inspired flat terminal theme as the handbooks.
   Self-contained: no external requests, works from file://.
   ============================================================================= */
:root {
  --brand: #FF7A00; --brand-press: #E86E00;
  --info: #2E9BFF; --violet: #8C6EFF;
  --bg: #0E0F13; --surface: #16181E; --surface-2: #1C1F27; --surface-3: #232733;
  --line: #262A33; --line-2: #333A46;
  --text: #EAECEF; --text-2: #99A1AD; --text-3: #626A78;
  --up: #00B96B; --down: #FA4D56; --warn: #FFA53D; --gold: #FFC53D;
  --r-sm: 6px; --r-md: 8px; --r-lg: 10px;
  --mono: "SF Mono", SFMono-Regular, ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  font-size: 14px; line-height: 1.62;
}
body.lang-zh { line-height: 1.78; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -0.02em; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; }
.wrap { max-width: 1500px; margin: 0 auto; padding: 0 20px; }
.mono { font-family: var(--mono); }

/* ---------------- top bar ---------------- */
.topbar { position: sticky; top: 0; z-index: 60; border-bottom: 1px solid var(--line);
  background: rgba(14,15,19,.94); backdrop-filter: blur(12px); }
.topbar .wrap { display: flex; align-items: center; gap: 16px; height: 54px; }
.brand { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.brand .logo { display: grid; place-items: center; width: 26px; height: 26px;
  border-radius: 7px; background: var(--brand); color: #17110A; font-size: 14px; font-weight: 800; }
.brand-text { font-weight: 600; } .brand-text b { font-weight: 800; }
.spacer { flex: 1; }
.tb-link { font-size: 13.5px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
.tb-link:hover { color: var(--text); }
.tb-ext { color: var(--text-3); }
.lang-btn { border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text);
  border-radius: var(--r-sm); padding: 6px 12px; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit; }
.lang-btn:hover { border-color: var(--brand); color: var(--brand); }

/* ---------------- hero / lesson picker ---------------- */
.hero { padding: 30px 0 18px; }
.hero h1 { font-size: clamp(26px, 4vw, 40px); line-height: 1.08; letter-spacing: -0.03em; font-weight: 800; }
.hero p { margin: 12px 0 0; max-width: 84ch; font-size: 14.5px; color: var(--text-2); }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--brand); margin-bottom: 6px; }

.filters { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
.filters input[type=search] {
  flex: 1; min-width: 200px; max-width: 320px;
  border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text);
  border-radius: var(--r-sm); padding: 8px 12px; font-size: 13px; font-family: inherit;
}
.filters input[type=search]:focus { outline: none; border-color: var(--brand); }
.fcount { font-size: 12px; color: var(--text-3); font-family: var(--mono); }
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 20px; }
.lcard { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface);
  padding: 14px 16px; cursor: pointer; transition: border-color .15s, transform .1s; text-align: left; font-family: inherit; }
.lcard:hover { border-color: var(--brand); }
.lcard:active { transform: translateY(1px); }
.lcard.done { border-left: 3px solid var(--up); }
.lcard .lh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
.lcard .lno { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.lcard h3 { font-size: 14.5px; color: var(--text); }
.lcard p { margin: 0; font-size: 12.4px; color: var(--text-2); line-height: 1.55; }
.lcard .ltags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; }
.tag { font-size: 10px; font-weight: 700; border-radius: 3px; padding: 2px 7px; letter-spacing: .02em; }
.tag-ord { color: var(--info); background: rgba(46,155,255,.14); }
.tag-ind { color: var(--brand); background: rgba(255,122,0,.14); }
.tag-opt { color: var(--violet); background: rgba(140,110,255,.15); }
.tag-done { color: var(--up); background: rgba(0,185,107,.14); }

/* ---------------- the lab ---------------- */
.lab { display: none; margin-top: 18px; }
.lab.on { display: block; }
.lab-grid { display: grid; grid-template-columns: 1fr 380px; gap: 14px; align-items: start; }
.panel { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.panel-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.panel-h h3 { font-size: 14px; }
.panel-h .sub { font-size: 11.5px; color: var(--text-3); font-family: var(--mono); }
.panel-b { padding: 14px; }
canvas { display: block; width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); }
.legend { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 8px; font-size: 11px; color: var(--text-3); }
.legend i { display: inline-block; width: 13px; height: 2px; margin-right: 5px; vertical-align: middle; }

/* step / progress */
.steps { display: flex; gap: 5px; margin-bottom: 12px; }
.stepdot { flex: 1; height: 3px; border-radius: 2px; background: var(--line-2); }
.stepdot.on { background: var(--brand); }
.stepdot.ok { background: var(--up); }

.stepbody { font-size: 13.6px; color: var(--text-2); line-height: 1.72; }
.stepbody b { color: var(--text); }
.stepbody .warnline { color: var(--warn); }
.stepbody ul { margin: 8px 0; padding-left: 20px; }
.stepbody li { margin: 4px 0; }
.stepbody code { font-family: var(--mono); font-size: 12.4px; color: var(--gold); }

.choices { display: grid; gap: 8px; margin-top: 12px; }
.choice { border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text-2);
  border-radius: var(--r-md); padding: 11px 13px; cursor: pointer; font-family: inherit;
  font-size: 13px; text-align: left; line-height: 1.55; transition: border-color .15s; }
.choice:hover { border-color: var(--brand); color: var(--text); }
.choice.sel { border-color: var(--brand); }
.choice.right { border-color: var(--up); background: rgba(0,185,107,.08); color: var(--text); }
.choice.wrong { border-color: var(--down); background: rgba(250,77,86,.08); color: var(--text); }
.choice .ck { font-family: var(--mono); font-size: 11px; color: var(--text-3); margin-right: 7px; }

.ctrl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px; margin-top: 10px; }
.ctrl label { font-size: 11.5px; font-weight: 600; color: var(--text-2); }
.ctrl output { font-family: var(--mono); font-size: 12.5px; color: var(--text); }
.ctrl input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--brand); height: 18px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; border-right: 1px solid var(--line); background: var(--surface-3);
  color: var(--text-2); font-family: inherit; font-size: 11.5px; font-weight: 600;
  padding: 6px 11px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--brand); color: #17110A; }

.btn { border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text-2);
  border-radius: var(--r-sm); padding: 8px 15px; font-size: 12.5px; font-weight: 600;
  cursor: pointer; font-family: inherit; }
.btn:hover { border-color: var(--brand); color: var(--text); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #17110A; }
.btn.primary:hover { background: var(--brand-press); color: #17110A; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.cta { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

/* readouts */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.kpi { border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 10px; }
.kpi .k { font-size: 10.5px; font-weight: 600; letter-spacing: .03em; color: var(--text-3); text-transform: uppercase; }
.kpi .v { font-family: var(--mono); font-size: 15px; font-weight: 700; margin-top: 2px; }
.kpi.wide { grid-column: 1 / -1; }
.v-up { color: var(--up); } .v-dn { color: var(--down); } .v-gold { color: var(--gold); }
.v-acc { color: var(--brand); } .v-info { color: var(--info); }

/* verdict */
.verdict { border-radius: var(--r-md); padding: 13px 15px; margin-top: 13px; font-size: 13.2px; line-height: 1.7; }
.verdict.pass { border: 1px solid rgba(0,185,107,.4); background: rgba(0,185,107,.08); }
.verdict.fail { border: 1px solid rgba(250,77,86,.4); background: rgba(250,77,86,.08); }
.verdict h4 { font-size: 13.5px; margin-bottom: 5px; }
.verdict.pass h4 { color: var(--up); } .verdict.fail h4 { color: var(--down); }
.verdict b { color: var(--text); }

/* counterfactual table */
.cf { width: 100%; border-collapse: collapse; font-size: 12.6px; margin-top: 10px; }
.cf th { text-align: left; padding: 7px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line);
  font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); }
.cf td { padding: 7px 10px; border-bottom: 1px solid var(--line); color: var(--text-2); }
.cf td.num { font-family: var(--mono); text-align: right; }
.cf tr.you td { background: rgba(255,122,0,.06); }
.cf td b { color: var(--text); }

.note { font-size: 11.6px; color: var(--text-3); line-height: 1.6; margin-top: 10px;
  border-top: 1px solid var(--line); padding-top: 9px; }
.fill-log { font-family: var(--mono); font-size: 11.4px; color: var(--text-2); line-height: 1.85; margin-top: 8px; }
.fill-log .ev { color: var(--text-3); }

footer { margin-top: 56px; border-top: 1px solid var(--line); padding: 22px 0 44px;
  font-size: 12px; color: var(--text-3); }
footer p { margin: 0 0 8px; max-width: 92ch; }
footer a { color: var(--text-2); text-decoration: underline; text-underline-offset: 2px; }

@media (max-width: 1080px) {
  .lab-grid { grid-template-columns: 1fr; }
}
@media (max-width: 780px) {
  .tb-link { display: none; } .tb-cv { display: inline; }
  .hero { padding: 22px 0 14px; }
}
</style>

<script>/* =============================================================================
   sim.js — the playground's execution engine.

   Purpose-built and compact, but the FILL SEMANTICS are ported from the order
   handbook rather than reinvented, because the lessons teach exactly those
   mechanics and a softer model would contradict the page it links from:

     1. a triggered stop is clamped NO BETTER than a gapped open
     2. a stop-limit above the gapped open fills NOTHING
     3. a resting limit takes a fraction of the bar's volume unless price
        trades THROUGH it
     4. sweep cost grows with size — sublinear in bps, superlinear in dollars
     5. a trailing stop locks a LEVEL; the fill is whatever the book pays

   Every scenario is driven by a seed keyed to its id, so the counterfactual
   is replayed on the IDENTICAL price path. Comparing a right and a wrong
   action across two different random draws would be noise, not a lesson.
   ============================================================================= */
(function (root) {
  'use strict';
  var PG = root.PG = root.PG || {};
  var S = PG.Sim = {};

  /* ------------------------------------------------------------------ rng */
  function rng(seed) {
    var h = 1779033703 ^ String(seed).length;
    for (var i = 0; i < String(seed).length; i++) {
      h = Math.imul(h ^ String(seed).charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    var s = h >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  S.rng = rng;
  function gauss(r) {
    var u = 0, v = 0;
    while (u === 0) u = r();
    while (v === 0) v = r();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * v);
  }

  /* --------------------------------------------------------------- regimes
     Each regime is a drift/vol schedule plus optional scripted events. The
     shapes are the ones the lessons need to talk about, not a general market
     model — a scenario is a teaching instrument. */
  var REGIMES = {
    /* a steady uptrend with ordinary pullbacks */
    trend_up: function (i, n, r, st) {
      return { drift: 0.0011, vol: 0.008 };
    },
    /* a range: mean-reverting around the starting level */
    range: function (i, n, r, st) {
      var pull = (st.p0 - st.px) / st.p0 * 0.09;
      return { drift: pull, vol: 0.007 };
    },
    /* quiet drift, then a violent overnight gap DOWN partway through */
    gap_down: function (i, n, r, st) {
      return { drift: 0.0004, vol: 0.0055 };
    },
    /* volatility compression, then an expansion break upward */
    squeeze_break: function (i, n, r, st) {
      var t = i / n;
      if (t < 0.62) return { drift: 0.0002, vol: 0.0022 };
      return { drift: 0.0026, vol: 0.011 };
    },
    /* flat into an event, then a large one-bar move */
    event: function (i, n, r, st) {
      return { drift: 0.0001, vol: 0.004 };
    }
  };

  /* Build a bar series. Scripted events are applied at fixed indices so a
     lesson can rely on them existing. */
  S.tape = function (opt) {
    var n = opt.bars || 120, r = rng(opt.seed), p = opt.p0 || 100;
    var st = { p0: opt.p0 || 100, px: p }, bars = [], i;
    var gapAt = opt.gapAt, gapPct = opt.gapPct || 0, evAt = opt.eventAt, evPct = opt.eventPct || 0;
    for (i = 0; i < n; i++) {
      var f = (REGIMES[opt.regime] || REGIMES.range)(i, n, r, st);
      var o = p;
      /* a scripted gap moves the OPEN away from the prior close, and the
         prices in between never trade — that is what makes it a gap */
      if (gapAt != null && i === gapAt) o = p * (1 + gapPct);
      if (evAt != null && i === evAt) o = p * (1 + evPct * 0.35);
      var drift = f.drift, vol = f.vol;
      if (evAt != null && i === evAt) { drift += evPct * 0.65; vol *= 2.2; }
      var c = o * (1 + drift + vol * gauss(r));
      var hi = Math.max(o, c) * (1 + Math.abs(gauss(r)) * vol * 0.55);
      var lo = Math.min(o, c) * (1 - Math.abs(gauss(r)) * vol * 0.55);
      /* U-shaped session volume, heavier on the extremes */
      var u = i / Math.max(1, n - 1);
      var vshape = 0.55 + 1.9 * (Math.pow(u - 0.5, 2) * 4);
      var v = Math.round((7000 + 5200 * r()) * vshape * (1 + Math.abs(c / o - 1) * 26));
      bars.push({ i: i, o: o, h: hi, l: lo, c: c, v: v });
      p = c; st.px = p;
    }
    return { n: n, bars: bars, seed: opt.seed, regime: opt.regime };
  };

  /* ------------------------------------------------------------------ book
     A 40-level ladder around the bar, thin at the touch and thickening
     outward — enough to make size cost money. */
  function ladder(bar, side, seed, ref) {
    var r = rng(seed + ':' + bar.i), lv = [], k;
    var mid = ref == null ? bar.c : ref;
    var tick = Math.max(0.01, mid * 0.0001);
    var base = side === 'buy' ? mid + tick / 2 : mid - tick / 2;
    for (k = 0; k < 40; k++) {
      var px = side === 'buy' ? base + k * tick : base - k * tick;
      var sz = Math.round((90 + 260 * r()) * (1 + k * 0.42));
      lv.push({ px: px, sz: sz });
    }
    return lv;
  }
  S.ladder = ladder;

  /* Walk the ladder. Returns the size-weighted average and how far it went.
     Cost in bps grows roughly as sqrt(size) — sublinear in bps, superlinear
     in dollars, which is the whole argument in the ORDER_BOOK entry. */
  /* `ref` is the price the order is executing AGAINST — the close for a
     resting market order, the trigger level for a stop. Sweeping a stop off
     the bar close can fill it better than its own level, which is backwards. */
  S.sweep = function (bar, side, qty, seed, ref) {
    var lv = ladder(bar, side, seed, ref), left = qty, notional = 0, done = 0, k = 0;
    for (; k < lv.length && left > 0; k++) {
      var take = Math.min(left, lv[k].sz);
      notional += take * lv[k].px; left -= take; done += take;
    }
    var overflow = false;
    if (left > 0) {
      /* beyond the modelled ladder, charge a square-root impact rather than
         pretending depth exists */
      overflow = true;
      var last = lv[lv.length - 1].px;
      var extra = last * (side === 'buy' ? 1 : -1) * 0.0009 * Math.sqrt(left / 1000);
      notional += left * (last + extra); done += left; left = 0;
    }
    var px = notional / Math.max(1, done);
    var mid = ref == null ? bar.c : ref;

             bps: (side === 'buy' ? 1 : -1) * (px - mid) / mid * 10000 };
  };

  /* ------------------------------------------------------------- order fills
     Each returns { filled, px, events[], residual }. `side` is the EXIT side
     for protective orders (a long is protected by a sell). */

    var i = o.at || 0, s = S.sweep(tape.bars[i], o.side, o.qty, tape.seed);
    return { filled: s.qty, px: s.px, residual: 0, at: i, sweep: s,
             events: [[i, 'market order swept ' + s.levels + ' levels']] };
  };

  E.STP = function (tape, o) {
    var b = tape.bars, i, ev = [];
    for (i = o.from || 0; i < tape.n; i++) {
      var hit = o.side === 'sell' ? b[i].l <= o.stop : b[i].h >= o.stop;
      if (!hit) continue;
      ev.push([i, 'stop triggered at ' + o.stop.toFixed(2)]);
      /* the bar already opened beyond the level, so the market the order meets
         is the gapped open, not the level it was written at */
      var through0 = o.side === 'sell' ? b[i].o < o.stop : b[i].o > o.stop;
      var ref = through0 ? b[i].o : o.stop;
      var s = S.sweep(b[i], o.side, o.qty, tape.seed, ref);
      var px = s.px;
      /* MECHANIC 1 — the bar already OPENED beyond the level, so the fill is
         clamped no better than that gapped open. This is the line that turns
         "my stop was 98 and I got 94" into arithmetic. */
      var through = through0;
      if (through) {
        px = o.side === 'sell' ? Math.min(px, b[i].o) : Math.max(px, b[i].o);
        ev.push([i, 'gapped open ' + b[i].o.toFixed(2) + ' — fill clamped no better than it']);
      }
      return { filled: o.qty, px: px, residual: 0, at: i, sweep: s, events: ev };
    }

             events: [[null, 'stop never triggered']] };
  };

  E.STL = function (tape, o) {
    var b = tape.bars, i, ev = [];
    for (i = o.from || 0; i < tape.n; i++) {
      var hit = o.side === 'sell' ? b[i].l <= o.stop : b[i].h >= o.stop;
      if (!hit) continue;
      ev.push([i, 'stop triggered at ' + o.stop.toFixed(2)]);
      /* MECHANIC 2 — if the bar OPENED beyond the limit the order is pushed
         out and left resting. Above the gapped open it fills nothing at all. */
      var openedBeyond = o.side === 'sell' ? b[i].o < o.limit : b[i].o > o.limit;
      var start = i;
      if (openedBeyond) {
        ev.push([i, 'market gapped past the limit — order left resting']);
        start = i + 1;
      }
      var rest = E.LMT(tape, { side: o.side, qty: o.qty, limit: o.limit, from: start });
      rest.events = ev.concat(rest.events);
      rest.at = rest.at == null ? null : rest.at;
      return rest;
    }
    return { filled: 0, px: null, residual: o.qty, at: null,
             events: [[null, 'stop never triggered']] };
  };

  E.LMT = function (tape, o) {
    var b = tape.bars, left = o.qty, fills = [], i, ev = [];
    for (i = o.from || 0; i < tape.n && left > 0; i++) {
      var fillable = o.side === 'sell' ? b[i].h >= o.limit : b[i].l <= o.limit;
      if (!fillable) continue;
      var tick = Math.max(0.01, b[i].c * 0.0001);
      var through = o.side === 'sell' ? b[i].h > o.limit + tick / 2 : b[i].l < o.limit - tick / 2;
      /* MECHANIC 3 — price merely TOUCHING your level gets you a slice of the
         bar's volume (the queue-priority stand-in); trading THROUGH you fills
         the lot. */
      var take = through ? left : Math.min(left, Math.max(100, Math.round(b[i].v * 0.06)));
      fills.push({ i: i, px: o.limit, qty: take });
      ev.push([i, (through ? 'traded through — ' : 'touched only — ') + take + ' @ ' + o.limit.toFixed(2)]);
      left -= take;
    }
    var got = fills.reduce(function (a, f) { return a + f.qty; }, 0);
    if (!got) ev.push([null, 'limit never reached — nothing filled']);
    else if (left > 0) ev.push([null, left + ' shares still resting at the close']);
    return { filled: got, px: got ? o.limit : null, residual: left,
             at: fills.length ? fills[0].i : null, fills: fills, events: ev };
  };

  /* MECHANIC 5 — the level ratchets in your favour and never retreats, then
     the fill is an ordinary market order with the same gap clamp. */
  E.TS = function (tape, o) {
    var b = tape.bars, i, ext = null, stop = null, ev = [];
    for (i = o.from || 0; i < tape.n; i++) {
      if (o.side === 'sell') {
        ext = ext == null ? b[i].h : Math.max(ext, b[i].h);
        var cand = ext - o.trail;
        stop = stop == null ? cand : Math.max(stop, cand);
        if (b[i].l <= stop) {
          ev.push([i, 'trail level ' + stop.toFixed(2) + ' reached']);
          var res = E.STP(tape, { side: 'sell', qty: o.qty, stop: stop, from: i });
          res.events = ev.concat(res.events);
          res.level = stop;
          return res;
        }
      } else {
        ext = ext == null ? b[i].l : Math.min(ext, b[i].l);
        var cd = ext + o.trail;
        stop = stop == null ? cd : Math.min(stop, cd);
        if (b[i].h >= stop) {
          var r2 = E.STP(tape, { side: 'buy', qty: o.qty, stop: stop, from: i });
          r2.events = ev.concat(r2.events); r2.level = stop;
          return r2;
        }

    }

             events: [[null, 'trail never reached']] };
  };

  /* ------------------------------------------------------------ indicators */
  var I = S.IND = {};
  I.sma = function (a, n) {
    var out = [], s = 0, i;
    for (i = 0; i < a.length; i++) {
      s += a[i]; if (i >= n) s -= a[i - n];
      out.push(i >= n - 1 ? s / n : null);
    }
    return out;
  };
  I.ema = function (a, n) {
    var k = 2 / (n + 1), out = [], prev = null, i;
    for (i = 0; i < a.length; i++) {

      if (prev == null) {

        prev = s / n;
      } else prev = a[i] * k + prev * (1 - k);

  };
  I.boll = function (a, n, w) {
    var mid = I.sma(a, n), up = [], dn = [], i, j;
    for (i = 0; i < a.length; i++) {
      if (mid[i] == null) { up.push(null); dn.push(null); continue; }
      var s = 0; for (j = i - n + 1; j <= i; j++) s += Math.pow(a[j] - mid[i], 2);
      var sd = Math.sqrt(s / n);
      up.push(mid[i] + w * sd); dn.push(mid[i] - w * sd);
    }
    return { mid: mid, up: up, dn: dn };
  };
  I.rsi = function (a, n) {
    var out = [null], au = 0, ad = 0, i;
    for (i = 1; i < a.length; i++) {
      var d = a[i] - a[i - 1], u = Math.max(d, 0), w = Math.abs(d);
      if (i <= n) { au += u / n; ad += w / n; out.push(i === n ? (ad ? au / ad * 100 : 50) : null); }
      else { au = (au * (n - 1) + u) / n; ad = (ad * (n - 1) + w) / n; out.push(ad ? au / ad * 100 : 50); }
    }
    return out;
  };
  I.atr = function (bars, n) {
    var tr = [], i;
    for (i = 0; i < bars.length; i++) {
      tr.push(i === 0 ? bars[i].h - bars[i].l
        : Math.max(bars[i].h - bars[i].l,
                   Math.abs(bars[i].h - bars[i - 1].c),
                   Math.abs(bars[i].l - bars[i - 1].c)));
    }
    return I.sma(tr, n);
  };

  /* -------------------------------------------------------------- options */
  function ncdf(x) {
    var b1 = .31938153, b2 = -.356563782, b3 = 1.781477937, b4 = -1.821255978,
        b5 = 1.330274429, p = .2316419, c = .39894228, t;
    if (x >= 0) { t = 1 / (1 + p * x); return 1 - c * Math.exp(-x * x / 2) * t * (t * (t * (t * (t * b5 + b4) + b3) + b2) + b1); }
    t = 1 / (1 - p * x); return c * Math.exp(-x * x / 2) * t * (t * (t * (t * (t * b5 + b4) + b3) + b2) + b1);
  }

                        : K * Math.exp(-r * T) * ncdf(-d2) - Sp * ncdf(-d1);
  };

<script>/* =============================================================================
   plot.js — the playground's chart layer. Candles, overlays, markers and the
   annotations a lesson needs to point at a specific bar.
   ============================================================================= */
(function (root) {
  'use strict';
  var PG = root.PG = root.PG || {};
  var P = PG.Plot = {};
  var CSSV = getComputedStyle(document.documentElement);
  function col(n) { return CSSV.getPropertyValue(n).trim() || '#888'; }
  P.col = col;

  function fit(cv) {
    var r = cv.getBoundingClientRect(), dpr = root.devicePixelRatio || 1;
    var w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
    if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    return { ctx: ctx, w: w, h: h };
  }

  P.frame = function (cv, n, y0, y1) {
    var f = fit(cv), l = 6, rp = 52, t = 10, b = 20;
    var iw = Math.max(1, f.w - l - rp), ih = Math.max(1, f.h - t - b);
    return {
      ctx: f.ctx, w: f.w, h: f.h, l: l, t: t, iw: iw, ih: ih, n: n, y0: y0, y1: y1,
      X: function (i) { return l + (i + 0.5) / Math.max(1, n) * iw; },
      BW: Math.max(1.5, iw / Math.max(1, n) * 0.62),
      Y: function (y) { return t + ih - (y - y0) / ((y1 - y0) || 1) * ih; }
    };
  };

  P.grid = function (F, fmt) {
    var ctx = F.ctx, i, v, py;
    ctx.save();
    ctx.strokeStyle = col('--line'); ctx.fillStyle = col('--text-3');
    ctx.lineWidth = 1; ctx.font = '10px ' + col('--mono');
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    for (i = 0; i <= 4; i++) {
      v = F.y0 + (F.y1 - F.y0) * i / 4; py = Math.round(F.Y(v)) + 0.5;
      ctx.beginPath(); ctx.moveTo(F.l, py); ctx.lineTo(F.l + F.iw, py); ctx.stroke();
      ctx.fillText((fmt || function (x) { return x.toFixed(2); })(v), F.l + F.iw + 6, py);
    }
    ctx.restore();
  };

  P.candles = function (F, bars) {
    var ctx = F.ctx;
    ctx.save();
    bars.forEach(function (b, i) {
      var up = b.c >= b.o, cl = up ? col('--up') : col('--down');
      var x = F.X(i);
      ctx.strokeStyle = cl; ctx.fillStyle = cl; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(Math.round(x) + 0.5, F.Y(b.h)); ctx.lineTo(Math.round(x) + 0.5, F.Y(b.l));
      ctx.stroke();
      var yo = F.Y(b.o), yc = F.Y(b.c);
      ctx.fillRect(x - F.BW / 2, Math.min(yo, yc), F.BW, Math.max(1, Math.abs(yc - yo)));
    });
    ctx.restore();
  };

  P.line = function (F, arr, color, w, dash) {
    var ctx = F.ctx, up = false, i;
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = w || 1.6; ctx.lineJoin = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    for (i = 0; i < arr.length; i++) {
      if (arr[i] == null || !isFinite(arr[i])) { up = false; continue; }
      if (!up) { ctx.moveTo(F.X(i), F.Y(arr[i])); up = true; }
      else ctx.lineTo(F.X(i), F.Y(arr[i]));
    }
    ctx.stroke(); ctx.restore();
  };

  P.hline = function (F, y, color, label, dash) {
    var ctx = F.ctx, py = Math.round(F.Y(y)) + 0.5;
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 1.3; ctx.setLineDash(dash || [5, 4]);
    ctx.beginPath(); ctx.moveTo(F.l, py); ctx.lineTo(F.l + F.iw, py); ctx.stroke();
    if (label) {
      ctx.setLineDash([]); ctx.fillStyle = color;
      ctx.font = '10px ' + col('--mono'); ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText(label, F.l + 4, py - 3);
    }
    ctx.restore();
  };

  P.vband = function (F, i0, i1, fill) {
    var ctx = F.ctx;
    ctx.save(); ctx.fillStyle = fill;
    var x0 = F.X(i0) - F.BW / 2, x1 = F.X(i1) + F.BW / 2;
    ctx.fillRect(x0, F.t, Math.max(1, x1 - x0), F.ih);
    ctx.restore();
  };

  P.marker = function (F, i, y, color, text, below) {
    var ctx = F.ctx, x = F.X(i), py = F.Y(y);
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    var dy = below ? 9 : -9;
    ctx.moveTo(x, py + (below ? 4 : -4));
    ctx.lineTo(x - 4.5, py + dy); ctx.lineTo(x + 4.5, py + dy);
    ctx.closePath(); ctx.fill();
    if (text) {
      ctx.font = '10px ' + col('--mono'); ctx.textAlign = 'center';
      ctx.textBaseline = below ? 'top' : 'bottom';
      ctx.fillText(text, x, py + (below ? 13 : -13));
    }
    ctx.restore();
  };

  P.bars = function (F, vals, color) {
    var ctx = F.ctx;
    ctx.save(); ctx.fillStyle = color;
    vals.forEach(function (v, i) {
      if (v == null) return;
      var y = F.Y(v), y0 = F.Y(F.y0);
      ctx.fillRect(F.X(i) - F.BW / 2, Math.min(y, y0), F.BW, Math.abs(y0 - y));
    });
    ctx.restore();
  };

  P.range = function (arr, pad) {
    var lo = Infinity, hi = -Infinity;
    arr.forEach(function (v) {
      if (v == null || !isFinite(v)) return;
      lo = Math.min(lo, v); hi = Math.max(hi, v);
    });
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    var p = (hi - lo) * (pad == null ? 0.08 : pad) + 1e-9;
    return [lo - p, hi + p];
  };
}(typeof globalThis !== 'undefined' ? globalThis : this));
</script>

<script>/* =============================================================================
   lessons.js — the scenarios.

   A lesson is: a fixed-seed tape + an ordered list of steps. Step kinds:
     info  prose, then Next
     pick  multiple choice; the wrong answers are the misconceptions the
           handbook entries warn about, and each carries its own explanation
     act   a parameterised action run through the engine, graded, and shown
           against the counterfactual REPLAYED ON THE SAME TAPE

   Text is bilingual inline: {en, zh}.
   ============================================================================= */
(function (root) {
  'use strict';
  var PG = root.PG = root.PG || {};
  var S = PG.Sim, M = S.money;

  function pctFmt(x) { return (x >= 0 ? '+' : '') + (x * 100).toFixed(2) + '%'; }

  /* ======================================================= 1 · stop vs gap */
  var stopGap = {
    id: 'stop-gap',
    kind: 'ord',
    title: { en: 'The stop that did not protect you', zh: '那个没能保护你的止损' },
    blurb: {
      en: 'You are long 2,000 shares with a stop below the market. Overnight the stock gaps through it. Find out what a stop actually promises — and what a stop-limit does instead.',
      zh: '你持有 2,000 股，并在下方挂了止损。隔夜股价跳空穿过它。看清止损究竟承诺了什么——以及止损限价单会做什么。'
    },
    tape: { regime: 'gap_down', seed: 'stop-gap-v1', bars: 90, p0: 100, gapAt: 58, gapPct: -0.061 },
    entry: { px: 100, qty: 2000 },
    overlays: ['ma20'],
    steps: [
      { kind: 'info',
        title: { en: 'The position', zh: '当前持仓' },
        body: {
          en: 'You are <b>long 2,000 shares at $100.00</b>. The tape below is the next 90 bars — you can see all of it, which a real trader cannot, because the point here is the mechanics rather than the prediction.<br><br>Somewhere in this session the stock <b>gaps down</b>: it opens far below the previous close and never trades the prices in between. That is the event every protective order is judged on.',
          zh: '你<b>以 $100.00 持有 2,000 股多头</b>。下面是接下来 90 根 K 线——你能看到全部，而真实交易者不能，因为这里要讲的是机制而不是预测。<br><br>这段行情中股价会<b>向下跳空</b>：开盘远低于前收，中间那些价格<b>从未成交过</b>。所有保护性订单都要在这个事件上接受检验。'
        } },
      { kind: 'pick',
        title: { en: 'What does a stop promise?', zh: '止损承诺了什么？' },
        body: { en: 'You place a <b>sell stop at $98.00</b>. Which statement is true?',
                zh: '你挂了一张 <b>$98.00 的卖出止损</b>。下面哪句话是对的？' },
        options: [
          { ok: false,
            label: { en: 'It sells my shares at $98.00.', zh: '它会以 $98.00 卖出我的股票。' },
            why: { en: 'No. A stop is a TRIGGER, not a price. Once touched it becomes a market order, and your $98.00 appears nowhere in the fill.',
                   zh: '错。止损是一个**触发器**，不是一个成交价。一旦触及它就变成市价单，而你的 $98.00 在成交环节完全不出现。' } },
          { ok: false,
            label: { en: 'It sells at $98.00 or better, never worse.', zh: '它会以 $98.00 或更好的价格成交，绝不会更差。' },
            why: { en: 'That is a LIMIT order. A stop has no floor at all — that is precisely the difference, and precisely what a gap exposes.',
                   zh: '那是**限价单**。止损完全没有下限——这正是两者的区别，也正是跳空会暴露的地方。' } },
          { ok: true,
            label: { en: 'It becomes a market order at $98.00 and fills wherever the book is.', zh: '它在 $98.00 变成市价单，成交在盘口当时的任何价格上。' },
            why: { en: 'Correct. The stop decides WHEN, never WHERE. Everything that follows in this lesson is a consequence of that one sentence.',
                   zh: '正确。止损决定**何时**，从不决定**在哪**。这一课后面的一切都是这句话的推论。' } }
        ] },
      { kind: 'act', ui: 'stopLevel',
        title: { en: 'Place your stop', zh: '设置你的止损' },
        body: { en: 'Choose the level and run the tape. The engine triggers on the first bar that touches it, then sweeps the book — with the same gap clamp the order handbook describes.',
                zh: '选择价位并运行行情。引擎会在首根触及的 K 线上触发，然后扫盘成交——采用与订单手册所述完全相同的跳空钳制规则。' },
        param: { key: 'stop', min: 90, max: 99.5, step: 0.05, def: 98, label: { en: 'Stop level', zh: '止损价位' } },
        run: function (tape, p) {
          return S.ENGINE.STP({ n: tape.n, bars: tape.bars, seed: tape.seed },
            { side: 'sell', qty: 2000, stop: p.stop, from: 0 });
        },
        grade: function (res, p, tape) {
          var slip = res.filled ? (p.stop - res.px) : 0;

          return {
            pass: pass,
            title: pass ? { en: 'Filled far below your level — exactly the point', zh: '成交价远低于你的价位——这正是重点' }
                        : { en: 'Try a level the gap actually crosses', zh: '换一个会被跳空穿过的价位' },
            body: pass
              ? { en: 'Your stop said <b>' + p.stop.toFixed(2) + '</b>. You were filled at <b>' + res.px.toFixed(2) +
                      '</b> — <b class="mono">' + slip.toFixed(2) + '</b> per share worse, or <b>' + M(slip * 2000) +
                      '</b> on 2,000 shares. Nothing malfunctioned. The market opened below your level and the prices in between never existed.',
                  zh: '你的止损写着 <b>' + p.stop.toFixed(2) + '</b>，实际成交在 <b>' + res.px.toFixed(2) +
                      '</b>——每股差 <b class="mono">' + slip.toFixed(2) + '</b>，2,000 股合计 <b>' + M(slip * 2000) +
                      '</b>。没有任何东西出故障：市场开在你的价位下方，中间那些价格根本不存在。' }
              : { en: 'Set the stop somewhere the gap will cross so the mechanic is visible.',
                  zh: '把止损设在跳空会穿过的位置，才能看到这个机制。' }
          };
        } },
      { kind: 'act', ui: 'compare',

              { cells: [{ v: { en: '100 shares', zh: '100 股正股' } },
                        { v: S0.toFixed(2) }, { v: S1.toFixed(2) },
                        { v: S.money(out.pnl.stock), tone: out.pnl.stock >= 0 ? 'up' : 'down' }] }
            ]
          };
          out.noCrush = (px(100, Ta, o.ivBefore, S1) - out.call.before) * 100;
          out.pick = p.struct || 'call';
          return out;
        },
        grade: function (res, p) {
          var got = res.pnl[res.pick];
          var pass = got > 0;
          return {
            pass: pass,
            title: pass ? { en: 'Positive — but look at what it cost to get there', zh: '盈利——但请看清楚代价' }
                        : { en: 'Direction right, money lost', zh: '方向对了，钱亏了' },
            body: {
              en: 'The stock moved <b class="mono">' + pctFmt(res.move) + '</b> on the print — <b>up</b>, and less than the ±6.5% the chain had priced. ' +
                  'Your ' + res.pick + ' returned <b>' + M(got) + '</b>.<br><br>' +
                  'The long call was worth <b>' + res.call.before.toFixed(2) + '</b> before and <b>' + res.call.after.toFixed(2) + '</b> after. ' +
                  'Had implied volatility <i>not</i> collapsed, that same move would have paid <b>' + M(res.noCrush) + '</b>. ' +
                  'The difference is the crush, and it is <b>always ≤ 0 for a long option regardless of direction</b>.',
              zh: '财报当根股价变动 <b class="mono">' + pctFmt(res.move) + '</b>——方向<b>向上</b>，但幅度小于期权链已定价的 ±6.5%。' +
                  '你选择的结构收益为 <b>' + M(got) + '</b>。<br><br>' +
                  '那张认购期权公布前值 <b>' + res.call.before.toFixed(2) + '</b>，公布后值 <b>' + res.call.after.toFixed(2) + '</b>。' +
                  '如果隐含波动率<i>没有</i>崩塌，同样这一段涨幅本可以赚到 <b>' + M(res.noCrush) + '</b>。' +
                  '两者之差就是 IV 崩塌，而它对多头期权<b>恒为负，与方向无关</b>。'
            }
          };
        } },
      { kind: 'act', ui: 'compare',
        title: { en: 'All three, one print', zh: '三种结构，同一次财报' },
        body: { en: 'Same move, same crush, same tape.', zh: '同样的波动、同样的崩塌、同样的行情。' },
        run: function (tape, p) {
          return ivCrush.steps[2].run(tape, { struct: 'call' });
        },
        grade: function (res) {
          return {
            pass: true,
            title: { en: 'Why the spread survives', zh: '为什么价差活了下来' },
            body: {
              en: 'The long call carries full vega and eats the whole crush. The <b>call spread</b> sold most of that vega back — the short 108 leg loses value on the crush too, and that loss is <i>your gain</i>, so the package barely notices. ' +
                  'The <b>stock</b> has no vega at all and simply keeps the move.<br><br>' +
                  'This is the quantitative form of the rule you already read in the handbook: <b>high IV → buy spreads, low IV → buy single legs</b>. It was never about being clever; it is about whether you can afford to be long vega into a scheduled collapse.',
              zh: '买入认购持有全部 vega，因而承受了完整的崩塌。<b>认购价差</b>把大部分 vega 卖了回去——卖出的 108 那条腿在崩塌中同样贬值，而这个贬值<b>是你的收益</b>，所以整个组合几乎不受影响。' +
                  '<b>正股</b>完全没有 vega，因此原封不动地拿到了这段涨幅。<br><br>' +
                  '这就是你在手册里读到的那条规则的量化形态：<b>高 IV 买价差，低 IV 买单腿</b>。它从来不是什么技巧，而是在问：<b>你是否承担得起在一次注定发生的崩塌之前做多 vega</b>。'
            }
          };
        } }
    ],
    close: {

      zh: '在任何财报交易之前，先解出让你回到打平所需的波动幅度：Δx + ½Γx² = |ν·Δσ| + |Θ·Δt|。答案通常非常接近市场隐含的波动幅度本身——也就是说，<b>你所期待的那个跳空，市场已经向你收过费了</b>。'

<script>/* content pack: one row per encyclopedia entry, keyed by handbook + id.
   Five ids exist in two handbooks with different meanings (ROC is Rate of
   Change in indicators and Return on Collateral in options), so a bare id

(function(r){r.PG=r.PG||{};r.PG.PACK={"ind.MA":{"src":"ind","eid":"MA","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Simple Moving Average","nameZh":"简单移动平均线","zh":{"insight":"真正有信息量的是斜率而不是数值本身：斜率为正即该周期上多头占优。斜率由相邻两根均线值相减得到。"},"en":{"insight":"The slope carries the information, not the level: positive slope means buyers control that horizon."}},"ind.BOLL":{"src":"ind","eid":"BOLL","cat":"pressure_support","fam":"channel-fade","bucket":"trade","name":"Bollinger Bands","nameZh":"布林带 / 布林通道","zh":{"insight":"σ 在这里是最近 20 根收盘价的总体标准差——注意它每根 K 线都重算，所以带宽是会呼吸的。"},"en":{"insight":"The lower band is the same distance the other way. These are not fixed levels; they are a statement about how unusual the current price is."}},"ind.MACD":{"src":"ind","eid":"MACD","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Moving Average Convergence and Divergence","nameZh":"指数平滑异同移动平均线","zh":{"insight":"α = 2/(n+1) 是指数加权系数：n 越大 α 越小，旧数据衰减越慢，线也就越平滑越滞后。"},"en":{"insight":"α = 2/(n+1) is the exponential weight: larger n means smaller α, slower decay of old data, and a smoother but later line."}},"ind.RSI":{"src":"ind","eid":"RSI","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Relative Strength Index","nameZh":"相对强弱指标","zh":{"insight":"等价写法。注意 RSI 衡量的是相对强弱，不是绝对涨跌幅：强趋势中 RSI 可以长期停留在 70 以上而价格继续上涨——超买不等于该卖。"},"en":{"insight":"Equivalent form. RSI measures relative strength, not absolute move size: in a strong trend it can sit above 70 for weeks while price keeps rising — overbought is not a sell signal."}},"ind.ADR_SPX":{"src":"ind","eid":"ADR_SPX","cat":"breadth","fam":"breadth-part","bucket":"read","name":"Advance/Decline Ratio (S&P 500)","nameZh":"涨跌比率（标普 500）","zh":{"insight":"常取 10 日均线平滑。注意这是比值，天然不对称（上不封顶、下限为 0），做平均前应先取对数，否则均值会被高值拉偏。"},"en":{"insight":"It is a ratio, so it is asymmetric — take logs before averaging or the mean is dragged by the upside."}},"ind.EMA":{"src":"ind","eid":"EMA","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Exponential Moving Average","nameZh":"指数移动平均线","zh":{"insight":"重心大约在 (n−1)/2 根之前，与同周期 SMA 相同——所以 EMA 并不比 SMA \"更快\"，它快的是对新价格的反应，不是整体重心。"},"en":{"insight":"Recursive: it needs only yesterday's value and today's price, not the whole window — which is why it is cheaper than an SMA."}},"ind.WMA":{"src":"ind","eid":"WMA","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Weighted Moving Average","nameZh":"加权移动平均线","zh":{"insight":"以 n=9 为例：WMA 重心 2.67 根，SMA/EMA 是 4.0 根。所以同周期下 WMA 明显更贴近价格、更少滞后，代价是更容易被单根异常 K 线带偏。"},"en":{"insight":"At n = 9 the WMA sits 2.67 bars back against 4.0 for SMA/EMA — less lag, but more sensitive to a single outlier bar."}},"ind.DEMA":{"src":"ind","eid":"DEMA","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Double Exponential Moving Average","nameZh":"双重指数移动平均线","zh":{"insight":"默认 n = 9。特别注意：DEMA 不是\"EMA 的 EMA\"，"},"en":{"insight":"The correction amplifies noise, so DEMA produces more false signals than a plain EMA in a chop."}},"ind.TEMA":{"src":"ind","eid":"TEMA","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Triple Exponential Moving Average","nameZh":"三重指数移动平均线","zh":{"insight":"DEMA 做一次修正，TEMA 做两次。修正阶数越高，滞后越小，但对噪音的放大也越严重——TEMA 在趋势里很漂亮，在震荡里会来回抽打。"},"en":{"insight":"Higher-order correction means less lag and more noise amplification — TEMA looks excellent in a trend and whipsaws badly in a range."}},"ind.HMA":{"src":"ind","eid":"HMA","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Hull Moving Average","nameZh":"赫尔移动平均线","zh":{"insight":"第二步（√n 的 WMA）负责恢复平滑。Hull 的巧妙之处在于用 √n 而不是 n 做最终平滑——既压住了噪音，又没有把刚刚消掉的滞后重新引入。"},"en":{"insight":"The trick is smoothing with √n rather than n — enough to tame the noise without reintroducing the lag just removed."}},"ind.LSMA":{"src":"ind","eid":"LSMA","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Least Squares Moving Average","nameZh":"最小二乘移动平均线","zh":{"insight":"默认 n = 25。TSF（时间序列预测）= a + b·n，就是同一条直线往前推一根的值。所以 LSMA 与 TSF 的差恰好是一个 b，两者形状完全相同、只差一个平移。"},"en":{"insight":"TSF is the same fitted line one bar ahead, so TSF − LSMA is exactly the slope b — identical shape, shifted."}},"ind.VWMA":{"src":"ind","eid":"VWMA","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Volume-Weighted Moving Average","nameZh":"成交量加权移动平均线","zh":{"insight":"真正的信号是两者的差值 VWMA − SMA，它衡量\"钱在哪个价位上\"，而单看 VWMA 本身与 SMA 差别不大。"},"en":{"insight":"The spread is the signal: it measures where the money actually traded, which a VWMA alone does not reveal."}},"ind.TWAP":{"src":"ind","eid":"TWAP","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Time-Weighted Average Price","nameZh":"时间加权平均价","zh":{"insight":"对比 VWAP = Σ(C×V)/ΣV。两者的差别就是\"时间平均\"与\"成交量平均\"之别：TWAP 假装每个时刻同等重要，VWAP 承认成交集中的时刻更重要。机构拆单时选 TWAP 还是 VWAP，本质是选择在时间上均匀铺开还是跟随市场真实成交节奏。"},"en":{"insight":"TWAP treats every moment as equally important; VWAP admits that moments with more trading matter more. Choosing between them as an execution algo is choosing between spreading evenly over time and following the market's actual rhythm."}},"ind.BBI":{"src":"ind","eid":"BBI","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Bull and Bear Index","nameZh":"多空指数","zh":{"insight":"重心约在 5.1 根之前，因此它的快慢大致相当于一条 EMA(11)。BBI 的价值不在于比单条均线更准，而在于它把\"短中长周期是否一致\"压缩成了一条线。"},"en":{"insight":"BBI is not more accurate than one average; it compresses \"do the short, medium and long horizons agree\" into a single line."}},"ind.GMMA":{"src":"ind","eid":"GMMA","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Guppy Multiple Moving Average","nameZh":"顾比复合移动平均线","zh":{"insight":"读法的核心是几何形态而不是任何单条线：两组都收窄并纠缠 = 分歧消失、变盘临近；短期组穿越长期组且两组同时张开 = 趋势确立；长期组保持张开而短期组回踩后重新张开 = 趋势中的健康回调，通常是顺势加仓点。"},"en":{"insight":"The geometry is the signal, not any single line: both groups compressed means a pending resolution; both fanned out after a cross means the trend is established."}},"ind.ADX":{"src":"ind","eid":"ADX","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Average Directional Index","nameZh":"平均趋向指数","zh":{"insight":"再算下沿变化：昨天最低价减今天最低价。注意方向定义，down 为正表示今天更低。"},"en":{"insight":"The absolute value means DX cares only how one-sided the move is, not which side."}},"ind.DMI":{"src":"ind","eid":"DMI","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Directional Movement Index","nameZh":"动向指标 / 趋向指标","zh":{"insight":"ADXR =（当前 ADX + m 根之前的 ADX）/2，被称为\"评估线\"。它比 ADX 更钝，用途是过滤 ADX 自身的抖动——ADX 上穿 ADXR 常被当作趋势确立的确认。"},"en":{"insight":"ADXR is deliberately duller than ADX; an ADX crossing above it is used as confirmation that a trend has taken hold."}},"ind.DDI":{"src":"ind","eid":"DDI","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Directional Divergence Index","nameZh":"方向标准离差指数","zh":{"insight":"AD 再对 ADDI 做 5 周期简单平滑。三层平滑意味着 DDI 系统反应很慢，它的定位是过滤噪音后的中期方向判断，不适合做短线信号。"},"en":{"insight":"Three layers of smoothing make this a slow, mid-horizon direction filter rather than a short-term signal."}},"ind.AROON":{"src":"ind","eid":"AROON","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Aroon Indicator","nameZh":"阿隆指标","zh":{"insight":"并且它永远到不了 0，下限就是 100/n。Aroon 的独特之处在于它衡量的是\"时间\"而不是\"价格幅度\"——它回答的是\"多久没创新高了\"，这是其他动量指标不提供的视角。"},"en":{"insight":"Each line takes only n discrete values, stepping by 100/n — it is a staircase, not a smooth curve."}},"ind.SI":{"src":"ind","eid":"SI","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Swing Index","nameZh":"摆动指数","zh":{"insight":"SI 是把上述量归一化后的摆动值，n 是涨跌停幅度除数。SI 单根意义不大，它的用途是累加成 ASI——用累计值来确认价格趋势是否被真实的波动结构支撑。"},"en":{"insight":"A single SI reading means little; it is designed to be accumulated into ASI, where the running total confirms whether price structure supports the trend."}},"ind.MI":{"src":"ind","eid":"MI","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Momentom Indicator","nameZh":"动量指标","zh":{"insight":"注意它无上下界，且以标的自身的价格单位计价——$500 的股票和 $5 的股票，MI 数值天然不可比。"},"en":{"insight":"Unbounded and quoted in the instrument's own price units, so it is not comparable between a $500 stock and a $5 one."}},"ind.TRIX":{"src":"ind","eid":"TRIX","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Triple Exponentially Smoothed Average","nameZh":"三重指数平滑均线","zh":{"insight":"TRIX 取三重平滑后序列的单根百分比变化率。注意是变化率而不是差值，"},"en":{"insight":"Being a percentage makes TRIX comparable across instruments, unlike MI or DMA which are quoted in price units. The cost of triple smoothing is heavy lag."}},"ind.DMA":{"src":"ind","eid":"DMA","cat":"trend","fam":"ma-lag","bucket":"trade","name":"DMA Indicator","nameZh":"平行线差指标","zh":{"insight":"注意它以标的价格单位计价、无上下界，因此不能跨品种比较，也不存在\"超买超卖\"阈值。"},"en":{"insight":"Price-unit quoted and unbounded, so there is no cross-instrument comparison and no overbought threshold."}},"ind.PRICEOSC":{"src":"ind","eid":"PRICEOSC","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Price Oscillator","nameZh":"价格振荡器","zh":{"insight":"因此本页这个变体的数值尺度与标准 PPO 略有差异，跨软件对比阈值时要留意这一点，不要直接套用别处的超买超卖水平。"},"en":{"insight":"The scale therefore differs slightly from the textbook PPO — do not carry overbought thresholds across from another platform."}},"ind.FO":{"src":"ind","eid":"FO","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Forecast Oscillator","nameZh":"预测振荡器","zh":{"insight":"也就是价格跑在自己的趋势前面了。它衡量的是\"相对自身趋势的偏离\"，因此在强趋势中也会频繁回到零轴附近——这与衡量绝对涨跌的动量指标有本质区别。"},"en":{"insight":"It measures deviation from the instrument's OWN trend, so it returns to zero even in a strong trend — unlike momentum indicators that measure absolute change."}},"ind.SAR":{"src":"ind","eid":"SAR","cat":"trend","fam":"stop-trail","bucket":"trade","name":"Parabolic Stop and Reverse","nameZh":"抛物线转向 / 停损点转向指标","zh":{"insight":"价格触及 SAR 时立即反手：SAR 跳到已跟踪的极值处，AF 重置。这就是 Stop and Reverse 的含义——它假设你永远持仓，不是多头就是空头。"},"en":{"insight":"Its fatal weakness is a range, where repeated flips stop you out again and again. It suits established trends only."}},"ind.SUPER_TREND":{"src":"ind","eid":"SUPER_TREND","cat":"trend","fam":"stop-trail","bucket":"trade","name":"Supertrend","nameZh":"超级趋势线","zh":{"insight":"注意这里的 ATR 用简单平均而非 Wilder 平滑，与经典 ATR 略有差异。"},"en":{"insight":"The clamps are what keep the line monotone within a leg — without them the stop would loosen and tighten with every ATR wiggle and stop being a stop."}},"ind.ALLIGAT":{"src":"ind","eid":"ALLIGAT","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Williams Alligator","nameZh":"威廉姆斯鳄鱼线","zh":{"insight":"\"右移 k 根\"意味着画在第 i 根位置上的值其实是用第 i−k 根的数据算出来的。这个位移是 Alligator 的精髓：它人为制造了三条线的间隔，让\"缠绕（鳄鱼睡觉，无趋势）\"与\"张口（鳄鱼进食，趋势启动）\"两种形态在视觉上极易分辨。代价是位移意味着这条线不能用作实时信号——它天然向右延伸到未来。"},"en":{"insight":"The displacement is the point: it manufactures separation so that \"sleeping\" (entwined, no trend) and \"feeding\" (fanned, trending) are visually unmistakable. The cost is that a displaced line cannot be used as a real-time signal."}},"ind.TSF":{"src":"ind","eid":"TSF","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Time Series Forecast","nameZh":"时间序列预测线","zh":{"insight":"但画在今天这根 K 线的位置上。理解这一点很关键：TSF 显示的是\"如果当前趋势按现有斜率持续，k 根之后会到哪\"，它是一个条件预测而非事实，趋势一旦转向，这个外推会立刻失效。"},"en":{"insight":"TSF shows where the current slope would put price k bars out — a conditional projection, not a fact. It breaks the moment the slope changes."}},"ind.TOWER":{"src":"ind","eid":"TOWER","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Tower Line","nameZh":"宝塔线","zh":{"insight":"所以传统画法过滤掉的噪音比这里两个版本都要多。使用时请知悉这个简化。"},"en":{"insight":"The classical 宝塔线 flips only when the close breaks the entire prior tower body, which may span many bars, so it filters more noise than either version here."}},"ind.HADIFF":{"src":"ind","eid":"HADIFF","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Heikin Ashi Difference","nameZh":"平均足实体差","zh":{"insight":"HADIFF 实际上是\"平均价格相对自身递归基线的偏离\"的平滑版本。这解释了它为什么比普通 K 线实体更少反复：它比较的不是当根开收，而是当根与历史基线的关系。代价是平均 K 线的开收价不是真实成交价，不能直接用来下单或计算盈亏。"},"en":{"insight":"Which is why it flips far less often than a real candle body — it compares the bar to a recursive baseline rather than to its own open. Note that Heikin-Ashi opens and closes are NOT tradable prices; never size a stop off them directly."}},"ind.SQUEEZE":{"src":"ind","eid":"SQUEEZE","cat":"trend","fam":"vol-size","bucket":"trade","name":"TTM Squeeze","nameZh":"TTM 挤压指标","zh":{"insight":"OSC 的符号给方向，斜率给加速度。标准用法是：挤压结束（由 ON 转 OFF）的那一刻，看 OSC 的符号决定做多还是做空。注意挤压本身不预测方向，它只预测\"要动了\"。"},"en":{"insight":"The squeeze predicts that something will move, not which way. The oscillator sign supplies the direction at the moment the squeeze releases."}},"ind.FISHER":{"src":"ind","eid":"FISHER","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Fisher Transform","nameZh":"费雪变换","zh":{"insight":"从而在数据尚不存在的位置制造出一根虚假的 −3 尖峰。这是实现层面的细节，但它决定了指标开头那几根是否可信。"},"en":{"insight":"Filling the warm-up bars with zero would manufacture a false −3 spike on data that does not exist yet."}},"ind.AO":{"src":"ind","eid":"AO","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Awesome Oscillator","nameZh":"动量震荡指标（AO）","zh":{"insight":"因此请读柱子的高度变化而不是颜色来判断加速度。这是渲染上的取舍，指标数值本身未受影响。"},"en":{"insight":"This page colours by sign instead, so read bar heights rather than colours for acceleration. The values themselves are unaffected."}},"ind.EWO":{"src":"ind","eid":"EWO","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Elliott Wave Oscillator","nameZh":"艾略特波浪震荡指标","zh":{"insight":"唯一的差别是平滑方式（SMA vs EMA）和价格输入（中价 vs 收盘）。两者在实盘中形态高度相似，不必同时使用。"},"en":{"insight":"Same periods, same construction — only the averaging method and the price input differ. They look nearly identical in practice, so there is little point running both."}},"ind.ATR":{"src":"ind","eid":"ATR","cat":"trend","fam":"vol-size","bucket":"trade","name":"Average True Range","nameZh":"平均真实波幅","zh":{"insight":"止损距离通常取 k × ATR，k 一般 1.5–3。用波动率而不是固定百分比设止损，才能让不同波动率的品种承担同等风险。"},"en":{"insight":"ATR% divides by price so the number is comparable across instruments — the raw ATR of a $500 stock and a $5 stock cannot be compared."}},"ind.VOLAT":{"src":"ind","eid":"VOLAT","cat":"trend","fam":"vol-size","bucket":"trade","name":"Historical Volatility","nameZh":"历史波动率（年化）","zh":{"insight":"先取对数收益率。用对数而不是简单百分比，是因为对数收益可加：多期收益直接相加即可，而百分比收益必须连乘。"},"en":{"insight":"Quick mental check: a 1-day 1σ move ≈ annual vol ÷ 16, since √252 ≈ 15.87."}},"ind.HLVOL":{"src":"ind","eid":"HLVOL","cat":"trend","fam":"vol-size","bucket":"trade","name":"HL Volatility","nameZh":"高低波幅率","zh":{"insight":"相当于近期均价的百分之多少。除以价格是关键一步——没有它，高价股的数值天然更大，跨品种无法比较。它与 ATR% 思路一致，区别在于 HLVOL 用区间高点低点，不含跳空。"},"en":{"insight":"Dividing by price is what makes it comparable across instruments. Same idea as ATR%, except HLVOL uses the window range and therefore ignores gaps."}},"ind.CHOP":{"src":"ind","eid":"CHOP","cat":"trend","fam":"vol-size","bucket":"trade","name":"Choppiness Index","nameZh":"震荡指数","zh":{"insight":"它必然落在 0–100 之间：因为总路程恒大于等于区间高度（下界），而极限情况下总路程最多为 n 倍区间（上界），取对数再除以 log(n) 正好把它归一化。核心直觉：同样从 A 走到 B，走直线的是趋势，来回折返的是震荡。CHOP 不判断方向，只判断\"效率\"，因此常用来决定该用趋势策略还是区间策略。"},"en":{"insight":"Bounded by construction: total travel is at least the range and at most n times the range, and the logarithms normalise that into 0–100."}},"ind.ER":{"src":"ind","eid":"ER","cat":"trend","fam":"vol-size","bucket":"trade","name":"Efficiency Ratio","nameZh":"效率比率（考夫曼）","zh":{"insight":"趋势明确（ER 高）时 α 变大、均线变快；震荡（ER 低）时 α 变小、均线变慢。这就是\"自适应\"的含义——用行情自身的效率来决定该快还是该慢，而不是固定一个周期。"},"en":{"insight":"That is what \"adaptive\" means: the market's own efficiency sets the smoothing, instead of a fixed period chosen in advance."}},"ind.RVI":{"src":"ind","eid":"RVI","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Relative Volatility Index","nameZh":"相对波动率指数","zh":{"insight":"唯一区别是累积的量从\"价格变化幅度\"换成了\"标准差\"。含义因此不同：RSI 问\"涨的力度占多少\"，RVI 问\"波动发生在上涨日还是下跌日\"。上涨伴随高波动通常是健康的突破，下跌伴随高波动才是恐慌。"},"en":{"insight":"RSI asks how much of recent movement was up; RVI asks whether the volatility itself occurred on up days or down days."}},"ind.RMI":{"src":"ind","eid":"RMI","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Relative Momentum Index","nameZh":"相对动量指标","zh":{"insight":"先取 m 根之前到今天的动量（m = 5），而不是相邻两根的变化。"},"en":{"insight":"With m = 1 it reduces exactly to an SMA-smoothed RSI. RMI is RSI with the comparison baseline pushed m bars back — smoother and later."}},"ind.SMIE":{"src":"ind","eid":"SMIE","cat":"trend","fam":"ma-lag","bucket":"trade","name":"SMI Ergodic Indicator","nameZh":"SMI 遍历指标","zh":{"insight":"注意源码里的嵌套顺序是先快后慢。双重平滑让它在保留方向敏感度的同时大幅压制噪音——分子会因正负抵消而变小，分母不会，因此震荡行情里读数自然趋近于零。"},"en":{"insight":"Double smoothing suppresses noise while keeping direction: the numerator shrinks through cancellation, the denominator does not, so a choppy market reads near zero by construction."}},"ind.SMIEO":{"src":"ind","eid":"SMIEO","cat":"trend","fam":"ma-lag","bucket":"trade","name":"SMI Ergodic Oscillator","nameZh":"SMI 遍历振荡器","zh":{"insight":"它就是 SMIE 的柱状图，不包含任何额外信息——如果已经在看 SMIE，就不需要再加这一条。同时看两者只会造成\"两个指标互相确认\"的错觉，实际上它们是同一个数。"},"en":{"insight":"It is the histogram of SMIE and contains no other information. Running both creates a false sense of confirmation from what is arithmetically one number."}},"ind.VMACD":{"src":"ind","eid":"VMACD","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Volume Moving Average Convergence and Divergence","nameZh":"量能异同移动平均","zh":{"insight":"因此纵轴尺度完全取决于个股，不能跨品种比较，也不存在通用阈值。用法是看它与价格 MACD 的配合：价格创新高而 VMACD 不配合，说明这波上涨没有增量成交支持。"},"en":{"insight":"Units are shares, so the scale is instrument-specific — no cross-symbol comparison and no universal thresholds. Its use is in divergence against the price MACD."}},"ind.EMV":{"src":"ind","eid":"EMV","cat":"trend","fam":"ma-lag","bucket":"trade","name":"Ease of Movement Value","nameZh":"简易波动指标","zh":{"insight":"EMV 高表示中价移动了很大一段距离，却只用了很少的成交量——即\"移动很容易\"。反过来，价格涨了但 EMV 很低，说明这一段上涨是靠巨量堆出来的，上方阻力沉重。它衡量的是价格移动的成本，这是纯价格指标和纯成交量指标都看不到的维度。"},"en":{"insight":"A high reading means price travelled a long way on little volume — movement was cheap. Rising price on a low EMV means the advance had to be bought heavily, which is a sign of overhead supply."}},"ind.IV":{"src":"ind","eid":"IV","cat":"trend","fam":"vol-regime","bucket":"read","name":"Implied Volatility","nameZh":"隐含波动率","zh":{"insight":"与已实现波动率对比：IV − HV 就是方差风险溢价。这个差长期为正，意味着期权买方系统性地在为保险付费——这是期权卖方长期占优的数学来源，也是买方必须靠方向或时点取胜的原因。"},"en":{"insight":"IV − HV is the variance risk premium. It is persistently positive, which is why systematic option buyers pay for insurance and sellers collect it."}},"ind.IV_RANK":{"src":"ind","eid":"IV_RANK","cat":"trend","fam":"vol-regime","bucket":"read","name":"Implied Volatility Rank","nameZh":"隐含波动率排名","zh":{"insight":"致命弱点：它只依赖两个数据点——窗口内的最高值和最低值。去年某天的一次崩盘尖峰会把最高值抬得很高，此后一整年的 IV Rank 都会被压低，让你误以为\"波动率很便宜\"。这正是需要同时看 IV Percentile 的原因。"},"en":{"insight":"It depends on exactly two data points — the window high and low. One crash spike a year ago inflates the high and suppresses every subsequent reading, making volatility look cheap when it is not."}},"ind.IV_PERCENTILE":{"src":"ind","eid":"IV_PERCENTILE","cat":"trend","fam":"vol-regime","bucket":"read","name":"Implied Volatility Percentile","nameZh":"隐含波动率百分位","zh":{"insight":"因此单个离群尖峰不会像扭曲 IV Rank 那样扭曲它。实务建议：两个一起看。IV Rank 高而 IV Percentile 不高，说明当前只是接近某个孤立的历史尖峰；两者同时高，才是真正意义上的波动率贵。"},"en":{"insight":"Using the full distribution means one outlier cannot distort it the way it distorts IV Rank. Read both: a high rank with a low percentile means you are merely near an isolated spike."}},"ind.KDJ":{"src":"ind","eid":"KDJ","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"KDJ Stochastics Indicator","nameZh":"随机指标 KDJ","zh":{"insight":"LLV / HHV 指窗口内的最低价与最高价，注意这里用的是最高/最低价而不是收盘价。"},"en":{"insight":"LLV and HHV use the high and low, not the close."}},"ind.SLOWKD":{"src":"ind","eid":"SLOWKD","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Slow KD indicator","nameZh":"慢速随机指标（慢速 KD）","zh":{"insight":"一个值得知道的等价关系：当 P1 = P2 = 3 时，这里的 K 线与 KDJ 的 D 线完全相同。所以同时挂 KDJ 和慢速 KD，你实际上是在看同一条线的两个副本，不构成互相印证。"},"en":{"insight":"With P1 = P2 = 3 this K line is identical to KDJ's D line. Running both is looking at the same series twice, not confirmation."}},"ind.STOCHRSI":{"src":"ind","eid":"STOCHRSI","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Stochastic RSI","nameZh":"随机相对强弱指标","zh":{"insight":"关键理解：STOCH 衡量的是 RSI 在它自己近期区间中的排名，而不是价格的排名。这就是它比 RSI 灵敏得多的原因——RSI 从 55 涨到 65 可能毫不起眼，但如果这段时间 RSI 一直在 50–65 之间波动，StochRSI 就会直接冲到 100。代价是它极易触及 0 和 100 两端，超买超卖信号泛滥，必须配合趋势过滤使用。"},"en":{"insight":"It ranks RSI within RSI's own recent range, not price within price's. That is why it is far more sensitive — and why it pins at 0 and 100 constantly, so it needs a trend filter."}},"ind.SRSI":{"src":"ind","eid":"SRSI","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Slow Relative Strength Index","nameZh":"慢速相对强弱指标","zh":{"insight":"重要警告：这既不是 Stochastic RSI，也不是 RSI。"},"en":{"insight":"This is NOT Stochastic RSI and it is NOT RSI."}},"ind.CRSI":{"src":"ind","eid":"CRSI","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Connors RSI","nameZh":"康纳斯相对强弱指标","zh":{"insight":"三者取平均。Connors 的设计思路是从三个正交的角度衡量超卖：价位、持续性、幅度。三者同时极端才是高置信度信号，这比单一 RSI 稳健得多，也是它专为短线均值回归策略设计的原因。"},"en":{"insight":"Three orthogonal views of oversold: level, persistence, magnitude. Requiring all three to be extreme is far more robust than a single RSI."}},"ind.WMSR":{"src":"ind","eid":"WMSR","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Williams %R","nameZh":"威廉指标（威廉超买超卖指标）","zh":{"insight":"%R = −100 ×（最高价 − 收盘）÷ 区间高度。注意负号：收盘越靠近区间顶部，值越接近 0。"},"en":{"insight":"%R is the unsmoothed %K of KDJ shifted by 100 — the same quantity, faster and rougher because it skips the smoothing."}},"ind.CCI":{"src":"ind","eid":"CCI","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Commodity Channel Index","nameZh":"顺势指标","zh":{"insight":"MD 是典型价格对均线的平均绝对偏差——注意是平均绝对偏差，不是标准差。用绝对值而非平方，使它对极端值不那么敏感。"},"en":{"insight":"Mean absolute deviation, not standard deviation — using absolutes rather than squares makes it less sensitive to outliers."}},"ind.CMO":{"src":"ind","eid":"CMO","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Chande Momentum Oscillator","nameZh":"钱德动量摆动指标","zh":{"insight":"与 RSI 唯一的实质差别是这里用未平滑的简单求和，而标准 RSI 用 Wilder 平滑。因此 CMO 更灵敏也更抖。"},"en":{"insight":"The only substantive difference is unsmoothed sums instead of Wilder smoothing, which makes it jumpier."}},"ind.TSI":{"src":"ind","eid":"TSI","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"True Strength Index","nameZh":"真实强弱指标","zh":{"insight":"TSIMA 是信号线。 TSI 的巧妙之处在于：震荡行情里分子因正负抵消而趋近于零，分母不受影响，读数自然回到零轴附近；而单边趋势中分子几乎等于分母，读数被推向 ±100。因此它天然地区分了\"有方向\"和\"没方向\"，这是单次平滑的动量指标做不到的。"},"en":{"insight":"In a chop the numerator cancels toward zero while the denominator does not, pulling TSI to the centre; in a one-way trend the two nearly match and it pins near ±100. It separates \"direction\" from \"no direction\" by construction."}},"ind.MFI":{"src":"ind","eid":"MFI","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Money Flow Index","nameZh":"资金流量指标","zh":{"insight":"默认 N = 14。 一句话概括：MFI 就是\"带成交量的 RSI\"。它与 RSI 的背离常被视为更可靠——价格创新高但 MFI 不创新高，说明推动这波新高的资金量在减少。"},"en":{"insight":"MFI is RSI with volume. A divergence carries more weight than an RSI divergence because it says the money behind the move is shrinking."}},"ind.RVGI":{"src":"ind","eid":"RVGI","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Relative Vigor Index","nameZh":"相对活力指数","zh":{"insight":"默认 N = 10，实际取值大致在 −1 到 +1。 核心直觉：牛市里收盘倾向于靠近最高价（实体占全幅比例高且为正），熊市里收盘倾向于靠近最低价。RVGI 就是把这个直觉量化。它衡量的是\"力度的转化效率\"，与衡量幅度的动量指标互补。"},"en":{"insight":"Bulls close near the high, bears close near the low. RVGI quantifies exactly that, measuring conversion efficiency rather than magnitude."}},"ind.BOP":{"src":"ind","eid":"BOP","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Balance of Power","nameZh":"均势指标（多空力道）","zh":{"insight":"等于 0：收盘等于开盘，即十字星，多空完全均衡。 因为完全不平滑，单根 BOP 噪音极大，实用上必须自己再取均线。它的价值在于纯粹：不含任何滞后，是对\"这一根到底谁赢了\"最直接的量化。"},"en":{"insight":"Being entirely unsmoothed makes a single bar very noisy; average it yourself. Its value is purity: zero lag, a direct answer to who won this bar."}},"ind.VRSI":{"src":"ind","eid":"VRSI","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Volume Relative Strength Index","nameZh":"成交量相对强弱指标","zh":{"insight":"因此 50 的含义是\"成交量持平\"，不是\"市场中性\"。这是最容易误读的一点：VRSI 高只说明成交量在放大，完全不指示价格方向——放量上涨和放量暴跌会给出同样高的读数。它必须与价格指标配合才有意义。"},"en":{"insight":"50 means volume is flat, NOT that the market is neutral. A high reading says volume is expanding and says nothing about direction — a volume surge into a crash reads the same as one into a breakout."}},"ind.ROC":{"src":"ind","eid":"ROC","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Rate of Change","nameZh":"变动率指标","zh":{"insight":"等于 15 表示比 12 根之前高 15%。 因为除以了基准价格，ROC 是百分比口径，可以跨品种比较——这是它相对于 MI（价格单位）的关键优势。注意 ROC 的分母是过去的价格，所以基期价格极低时读数会被放大失真，看长周期 ROC 时要留意基期是否处在异常低位。"},"en":{"insight":"Being a percentage makes ROC comparable across instruments, unlike price-unit momentum. Watch the base: an unusually low reference price inflates the reading."}},"ind.MTM":{"src":"ind","eid":"MTM","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Momentum","nameZh":"动量指标","zh":{"insight":"与 ROC 的关系：ROC = MTM ÷ 基准价 × 100。也就是说 ROC 就是把 MTM 归一化成百分比。因为 MTM 保留价格单位，它不能跨品种比较，也不能跨时间比较同一只股票——股价从 10 元涨到 100 元后，同样 5 元的 MTM 意义完全不同。"},"en":{"insight":"ROC is simply MTM normalised by the base price. Because MTM keeps price units it cannot be compared across instruments, or even across time for one instrument once the price level has changed."}},"ind.OSC":{"src":"ind","eid":"OSC","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Oscillator","nameZh":"摆动量指标","zh":{"insight":"不是百分比。这是极易误读的一点——数值 500 不代表 500%，只代表价格高出均线 5 元。"},"en":{"insight":"A reading of 500 means the price is 5 currency units above the average, not 500%."}},"ind.DPO":{"src":"ind","eid":"DPO","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Detrended Price Oscillator","nameZh":"区间震荡线 / 去趋势价格摆动指标","zh":{"insight":"DPO = 当前收盘 − 向前平移 shift 根的均线值。注意均线是被回移的，不是当前的均线。"},"en":{"insight":"That removes the trend and leaves the cycle around it — DPO is a tool for finding cycle LENGTH, not direction. The displacement also means the last few bars cannot be computed, so it is not a real-time signal."}},"ind.BIAS":{"src":"ind","eid":"BIAS","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Bias Ratio","nameZh":"乖离率","zh":{"insight":"但请注意这些只是约定俗成而非常数：高波动的小盘股、题材股完全可以长期维持更大的乖离。使用前应针对具体标的用历史分布重新校准，直接套用会在强势股上过早卖出。"},"en":{"insight":"These are conventions, not constants. A volatile small cap can sustain much larger deviations, so recalibrate per symbol from its own history rather than importing the numbers."}},"ind.B3612":{"src":"ind","eid":"B3612","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Bias3-Bias6 and Bias6-Bias12","nameZh":"三六乖离 / 均线差指标","zh":{"insight":"真正的乖离率需要除以均线并乘 100。因此 B3612 不能跨品种比较，它的用途是观察短中期均线之间的收敛与发散（与 MACD 的 DIF 思路相同），而不是判断偏离程度。"},"en":{"insight":"So B3612 cannot be compared across instruments. Its use is watching short and medium averages converge and diverge, like MACD's DIF, not measuring stretch."}},"ind.DBCD":{"src":"ind","eid":"DBCD","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Bias Convergence Divergence","nameZh":"异同离差乖离率","zh":{"insight":"先取 5 周期乖离率，注意这里没有乘 100，所以是小数形式。"},"en":{"insight":"Roughly 95 bars of warm-up before the first trustworthy value, and it reacts very slowly by design. It is a long-horizon divergence detector, not a timing tool."}},"ind.SRDM":{"src":"ind","eid":"SRDM","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"SRDM Indicator","nameZh":"动向速度指标","zh":{"insight":"SRDM =（上 − 下）÷ 两者中的较大者。除以较大者而不是两者之和，是为了让结果严格落在 −1 到 +1，且在一方为零时直接取到端点。"},"en":{"insight":"Dividing by the larger of the two rather than their sum keeps the result strictly within ±1 and pins it to the endpoint when one side is zero."}},"ind.RCI":{"src":"ind","eid":"RCI","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Rank Correlation Index","nameZh":"顺位相关指数","zh":{"insight":"默认同时画 5、25、50 三条。RCI 的独特之处在于它只看顺序不看幅度：一根涨停和一根微涨在排名上贡献相同。这让它对异常值天然免疫，但也意味着它无法区分温和上涨和暴力拉升。"},"en":{"insight":"RCI reads ORDER, not magnitude — a limit-up bar and a marginally higher bar contribute identically. That makes it immune to outliers and blind to the size of a move."}},"ind.MASS":{"src":"ind","eid":"MASS","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Mass Index","nameZh":"梅斯线 / 质量指数","zh":{"insight":"确认线约 10.6。请务必换算而不要直接套用 27——直接套用会导致这个指标永远不触发。质量指标衡量的是振幅的扩张（而非方向），它提示\"波动在放大、可能变盘\"，不告诉你往哪变。"},"en":{"insight":"Importing 27 from the textbook while running M = 10 means the indicator can never fire. Mass measures range expansion, not direction."}},"ind.VROC":{"src":"ind","eid":"VROC","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Volume Rate-Of-Change","nameZh":"成交量变动率","zh":{"insight":"等于 0 表示今日成交量与 M 根之前那一根单根相等。这是关键：基准是单独一根，不是平均值，所以如果那一根恰好是异常放量或异常缩量，读数会严重失真。"},"en":{"insight":"The base is a single bar, not an average, so an abnormal reference bar distorts the reading badly."}},"ind.ADTM":{"src":"ind","eid":"ADTM","cat":"strength","fam":"osc-threshold","bucket":"trade","name":"Adaptive Medias Inc Stock Technical Analysis","nameZh":"动态买卖气指标","zh":{"insight":"惯例阈值：大于 +0.5 视为超买，小于 −0.5 视为超卖。同样建议按标的历史分布校准，不要直接套用。"},"en":{"insight":"Calibrate the ±0.5 convention against the instrument's own history rather than importing it."}},"ind.BBIBOLL":{"src":"ind","eid":"BBIBOLL","cat":"pressure_support","fam":"channel-fade","bucket":"trade","name":"Bullish-Bear Bollinger","nameZh":"多空布林线 / BBI 布林带","zh":{"insight":"σ 取 BBI 这条已平滑曲线 的样本标准差（N = 11），而不是收盘价的标准差。这是它与布林带最本质的差别。"},"en":{"insight":"The deviation of the SMOOTHED line, not of the close — the essential difference from Bollinger."}},"ind.BBW":{"src":"ind","eid":"BBW","cat":"pressure_support","fam":"vol-size","bucket":"trade","name":"Bollinger Band Width","nameZh":"布林带宽 / 布林通道宽度","zh":{"insight":"化简后等于 2 × W × σ ÷ 中轨——注意上下轨相减时中轨被消掉了，只剩标准差与价格之比。"},"en":{"insight":"Dividing by the middle band is what makes it comparable across instruments and across decades, which the raw bands are not."}},"ind.CDP":{"src":"ind","eid":"CDP","cat":"pressure_support","fam":"channel-fade","bucket":"trade","name":"CDP Indicator","nameZh":"逆势操作系统 / CDP 指标","zh":{"insight":"这就是这些线画成水平阶梯的原因。实用价值正在于此：开盘前就知道今天的关键价位，可以提前挂单，不需要盘中临时判断。"},"en":{"insight":"That is the practical value: you know today's levels in advance and can place orders ahead of time rather than deciding mid-session."}},"ind.CKS":{"src":"ind","eid":"CKS","cat":"pressure_support","fam":"stop-trail","bucket":"trade","name":"Chande Kroll Stop","nameZh":"钱德-克罗尔止损线","zh":{"insight":"因此它不会因为单根 K 线的波动而突然放松。这是与简单 ATR 追踪止损的关键区别——后者会随每根 ATR 抖动而时紧时松，失去止损应有的确定性。"},"en":{"insight":"A plain ATR trail loosens and tightens with every bar; the second pass makes this one move only when the whole recent history of candidates has moved."}},"ind.DC":{"src":"ind","eid":"DC","cat":"pressure_support","fam":"channel-fade","bucket":"trade","name":"Donchian Channel","nameZh":"唐奇安通道","zh":{"insight":"通道本身就是近期价格的极值。这是它最大的优点：不存在参数拟合，也不存在滞后争议，突破就是字面意义上的\"创 N 根新高\"。代价是极值对单根异常 K 线完全没有抵抗力。"},"en":{"insight":"No fitting and no lag debate — a breakout literally means a new N-bar extreme. The cost is zero resistance to a single outlier bar."}},"ind.ENE":{"src":"ind","eid":"ENE","cat":"pressure_support","fam":"channel-fade","bucket":"trade","name":"Moving Average Envelopes","nameZh":"轨道线 / 均线包络","zh":{"insight":"下轨 = 均线 ×(1 − 9%)。注意上下幅度不相等，这是有意设计：上涨行情的空间通常大于下跌。"},"en":{"insight":"So the midline sits 1% above the moving average. Mistaking it for the average introduces a systematic 1% bias."}},"ind.KC":{"src":"ind","eid":"KC","cat":"pressure_support","fam":"channel-fade","bucket":"trade","name":"Keltner Channel","nameZh":"肯特纳通道","zh":{"insight":"而不是 Wilder 平滑——与经典肯特纳通道略有差异，数值会略有不同。"},"en":{"insight":"Bollinger uses the deviation of closes and is blind to gaps. That is why Keltner reflects real risk better on gap-prone instruments, and why TTM Squeeze compares the two."}},"ind.MIKE":{"src":"ind","eid":"MIKE","cat":"pressure_support","fam":"channel-fade","bucket":"trade","name":"MIKE Base","nameZh":"麦克支撑压力指标","zh":{"insight":"每根重算得到。因此它们之间的间距是固定的比例关系，本质上是把区间按倍数向外投射。这类\"压力支撑位\"没有成交量或持仓依据，只是几何外推——请把它当作参考刻度而非真实的市场结构。"},"en":{"insight":"All six are geometric projections of the same three numbers, with no volume or positioning behind them. Treat them as a reference scale, not as real market structure."}},"ind.PPSW":{"src":"ind","eid":"PPSW","cat":"pressure_support","fam":"channel-fade","bucket":"trade","name":"Pivot Points Standard - Woodie","nameZh":"伍迪枢轴点 / 标准枢轴-Woodie","zh":{"insight":"Woodie 枢轴 =（前窗口高 + 前窗口低 + 2×开盘）÷ 4。注意它给开盘价双倍权重，这正是 Woodie 版本与标准枢轴的唯一区别——标准版用收盘价且不加权。"},"en":{"insight":"The outer levels are pure geometric extrapolation; in practice only PP, R1 and S1 carry much weight."}},"ind.VOL":{"src":"ind","eid":"VOL","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"Volume","nameZh":"成交量","zh":{"insight":"单看一根成交量的绝对值毫无意义（大盘股天然量大）。它必须以比率形式来读："},"en":{"insight":"An absolute print means nothing on its own — only the ratio to its own recent average does."}},"ind.MAVOL":{"src":"ind","eid":"MAVOL","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"volume moving average","nameZh":"成交量均线","zh":{"insight":"当 MAVOL5 站上 MAVOL20 且同步上行，说明整个活跃度体制在升温——这是趋势启动前常见的前置条件，比单日放量可靠得多。"},"en":{"insight":"MAVOL5 crossing above MAVOL20 and rising means the whole activity regime is heating up — a far more reliable precondition than any single high-volume bar."}},"ind.AVGVOL":{"src":"ind","eid":"AVGVOL","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"Average Volume","nameZh":"平均成交量","zh":{"insight":"这样一根异常放量的 K 线就不会把用来衡量它自己的那把尺子撑大。若不排除，一根 10 倍量的 K 线会自己把均值抬高，导致\"相对量\"被系统性低估。"},"en":{"insight":"Excluding today stops a spike from inflating the very yardstick it is measured against — otherwise a 10x bar lifts the mean and understates itself."}},"ind.NVOL":{"src":"ind","eid":"NVOL","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"Net Volume","nameZh":"净成交量","zh":{"insight":"从第一根开始累加净量，得到的就是 OBV。理解这一点后就明白：OBV 的所有优点和缺陷都源自这个粗糙的符号规则。"},"en":{"insight":"Accumulating NVOL from the first bar gives OBV, so every strength and flaw of OBV traces back to this crude sign rule."}},"ind.RVOL":{"src":"ind","eid":"RVOL","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"Relative Volume","nameZh":"相对成交量 / 量比","zh":{"insight":"因为日内成交量呈 U 型分布（开盘和收盘放量、午间清淡）。用全天平均去比较上午十点的量会得出完全错误的结论——这是日内使用 RVOL 时最常见的错误。"},"en":{"insight":"Session volume is U-shaped, so comparing a 10am print against a whole-day average is simply wrong — the most common mistake in intraday RVOL use."}},"ind.VSTD":{"src":"ind","eid":"VSTD","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"Volume STD","nameZh":"成交量标准差","zh":{"insight":"CV = 标准差 ÷ 均值。除以均值消掉了量纲，得到的是\"波动相对于自身平均水平\"的无量纲比率。"},"en":{"insight":"Dividing by the mean removes the units, giving a dimensionless measure of variability relative to the instrument's own normal."}},"ind.VOSC":{"src":"ind","eid":"VOSC","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"Volume Oscillator","nameZh":"成交量震荡指标","zh":{"insight":"小于 0 表示量能萎缩。因为刻度不对称，请不要把别处的对称阈值（如 ±20）直接搬过来用。"},"en":{"insight":"Because the scale is asymmetric, symmetric thresholds imported from elsewhere do not apply."}},"ind.AMOUNT":{"src":"ind","eid":"AMOUNT","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"Turnover","nameZh":"成交额","zh":{"insight":"（这个重建值与交易所公布数的差异，仅来自该根 VWAP 与收盘价之间的漂移，通常很小。）"},"en":{"insight":"The reconstruction differs from the exchange figure only by the drift between the bar's VWAP and its close."}},"ind.TOR":{"src":"ind","eid":"TOR","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"Turnover Ratio","nameZh":"换手率","zh":{"insight":"高于 15% 属投机狂热，意味着几天内整个流通盘就换了一遍手。"},"en":{"insight":"The denominator on this page is synthetic and for shape only."}},"ind.VOLTDX":{"src":"ind","eid":"VOLTDX","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"Virtual Volume","nameZh":"虚拟成交量 / 预估量","zh":{"insight":"真实成交量以及它的 5、10 周期均线——外推部分在历史上不留痕迹。"},"en":{"insight":"On a historical chart nothing of the projection survives; only volume and its two averages remain."}},"ind.PER":{"src":"ind","eid":"PER","cat":"price_volume","fam":"ratio-quality","bucket":"define","name":"P/E","nameZh":"市盈率","zh":{"insight":"前瞻市盈率用未来十二个月的预估每股收益——注意这是分析师预测，不是事实。"},"en":{"insight":"Forward EPS is an analyst estimate, not a fact."}},"ind.OBV":{"src":"ind","eid":"OBV","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"On Balance Volume","nameZh":"能量潮","zh":{"insight":"涨跌的幅度被完全忽略——涨 0.1% 和涨 5% 对 OBV 的贡献完全相同。这既是它简洁的地方，也是它最大的缺陷：价格与 OBV 背离时要先怀疑这个粗糙的符号规则。"},"en":{"insight":"The size of the move is ignored entirely: +0.1% and +5% contribute identically. That is the simplification, and its main weakness — when price and OBV diverge, suspect this crude sign rule first."}},"ind.VWAP":{"src":"ind","eid":"VWAP","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"Volume Weighted Average Price","nameZh":"成交量加权平均价","zh":{"insight":"anchor = 0 表示永不重置，即从某个指定事件（财报、缺口、阶段低点）起算的锚定 VWAP——机构常用它衡量某笔建仓至今的盈亏。"},"en":{"insight":"anchor = 0 never restarts, giving an anchored VWAP from a chosen event (an earnings gap, a swing low). Desks use it to judge whether a position built since that event is under water."}},"ind.VWAP_BAND":{"src":"ind","eid":"VWAP_BAND","cat":"price_volume","fam":"channel-fade","bucket":"trade","name":"VWAP Bands","nameZh":"成交量加权均价通道","zh":{"insight":"⚠ 请注意这里的记忆长度是混合的：中轨 VWAP 从锚点一路累计（记忆越来越长），"},"en":{"insight":"Late in a session the VWAP centre is heavy and barely moves while the band width still reacts to recent volatility — so Bollinger intuitions do not transfer."}},"ind.EFI":{"src":"ind","eid":"EFI","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"Elder's Force Index","nameZh":"艾尔德力度指标","zh":{"insight":"n = 2 用于短线入场时点，这是埃尔德本人的用法：极短周期让它在回调结束的瞬间转向。"},"en":{"insight":"Direction-and-size multiplied by participation: real force needs both, and either alone is not enough."}},"ind.KO":{"src":"ind","eid":"KO","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"Klinger Oscillator","nameZh":"克林格成交量摆动指标","zh":{"insight":"和日测量（dm）三个附加项，本实现全部省略。因此本页数值与原版软件不会完全一致，形态相近但不可直接对照阈值。"},"en":{"insight":"The original carried a trend counter plus cumulative and daily measurement terms, all dropped here. Shapes are similar but absolute values will not match another platform."}},"ind.WVAD":{"src":"ind","eid":"WVAD","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"William's Variable Accumulation Distribution","nameZh":"威廉变异离散量","zh":{"insight":"下面这条未平滑的形式才是公式字面所说的东西。这意味着你在别处看到的 WVAD 可能与此处形态差异很大——使用前务必确认所用软件是否做了累加。"},"en":{"insight":"Most platforms plot a 6- or 24-bar sum instead, so the shape elsewhere can look very different. Check which form your software uses."}},"ind.CR":{"src":"ind","eid":"CR","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"CR Indicator","nameZh":"CR 中间意愿指标","zh":{"insight":"今天显示的 CRMA5，其实是三根之前那个时点的 5 周期均值。这样做是为了让四条线之间形成稳定的间隔结构，从而用它们的相对位置划分强弱区间——理解这一点后就不会误以为它有前瞻性。"},"en":{"insight":"The shift is deliberate lag, not a forecast: today's CRMA5 is the 5-bar average as it stood three bars ago. It exists to create stable spacing between the four lines."}},"ind.ARBR":{"src":"ind","eid":"ARBR","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"Arbor Entech","nameZh":"人气意愿指标（AR / BR）","zh":{"insight":"在没有跳空的品种上，AR 与 BR 完全相同。这就是为什么两者要一起看：BR 显著高于 AR，说明多头能量主要来自隔夜跳空而非日内实际买盘，这种上涨的持续性通常较差。"},"en":{"insight":"On a gapless instrument the two are identical. BR running well above AR means the strength came from the overnight gap rather than intraday buying, which tends to be less durable."}},"ind.PSY":{"src":"ind","eid":"PSY","cat":"price_volume","fam":"volume-confirm","bucket":"trade","name":"Psychological Line","nameZh":"心理线","zh":{"insight":"0、8.33、16.67 …… 91.67、
